le_reason":"Não há diagnóstico técnico dedicado de CRO (skill ee-s2-diagnostico-cro ainda não executada) nem acesso a Google Analytics/Search Console/heatmap — velocidade, taxa de conversão real e eventos de tracking configurados são inferidos do conteúdo da LP, não medidos diretamente."}},{"pillar":"crm","score":14,"classification":"critical","highlight":"Linx é citado como ERP/PDV mas o uso formal não está confirmado e não há nenhuma integração com o funil de mídia — hoje a triagem de lead e a atribuição de venda são 100% manuais.","estimated":true,"details":{"strengths":["Base de clientes de 30+ anos existe dentro do Linx — apontada em múltiplas fontes como o ativo mais valioso e subutilizado do grupo (nível 4 de consciência, já compraram antes)","Uso planejado já desenhado: upload como audiência personalizada e lookalike (1% e 2%) no Meta, exclusão de compradores recentes, campanha de reengajamento por segmento"],"weaknesses":["Linx citado como ERP nos documentos pós-briefing, mas o próprio pré-kick-off respondeu apenas 'computador, celular' na pergunta sobre sistemas de gestão — uso formal não confirmado","Nenhuma integração entre Linx e mídia paga — qualquer 'cliente atendido' ou CAC reportado hoje é estimativa cruzada manualmente, não dado de sistema","Sem pipeline comercial formalizado, sem scripts de vendas (has_scripts: false) e sem nenhuma régua de follow-up ou pós-venda ativa"],"metrics":{"vendedores_ativos_confirmados":null,"has_scripts":false,"regua_pos_venda_ativa":false},"unavailable_reason":"Não há acesso ao Linx nem confirmação formal de que é o sistema em uso nas 3 lojas + Rainha Modas — score reflete a ausência de CRM de marketing estruturado descrita no briefing e no handoff, não uma auditoria direta do sistema."}},{"pillar":"seo","score":29,"classification":"low","highlight":"Google Meu Negócio é o único ativo forte do diagnóstico (4,6/5,0, 327+ avaliações), mas é o único sinal positivo dentro de um pilar SEO no restante vazio: sem blog, sem conteúdo indexado, sem dados de Search Console.","estimated":true,"details":{"strengths":["GMB com nota 4,6/5,0 e mais de 327 avaliações — ativo forte e comprovado, mas ainda pouco explorado digitalmente (posts, Q&A e categorias não confirmados como otimizados)","Zero concorrentes ativos anunciando nos termos de busca de categoria em Vilhena (~410 buscas/mês combinadas) — espaço aberto, embora isso seja mais sinal de mídia paga que de SEO orgânico","Site publicado com estrutura básica (14 blocos), o que dá uma base mínima para indexação"],"weaknesses":["Nenhum blog ou conteúdo orgânico indexado identificado — aquisição orgânica hoje depende quase 100% do GMB","Sem acesso ao Google Search Console — não é possível confirmar keywords orgânicas rankeadas, impressões ou posição real","Otimização local do GMB (categoria, posts semanais, perguntas e respostas) não confirmada como completa"],"metrics":{"gmb_nota":4.6,"gmb_avaliacoes":"327+","gmb_reivindicado":true,"buscas_mensais_categoria":410,"concorrentes_ativos_busca_paga":0},"unavailable_reason":"Sem acesso ao Google Search Console e sem auditoria técnica de SEO on-page — score é estimado a partir do briefing, da pesquisa pública sobre o GMB e da ausência documentada de blog/conteúdo, não de uma auditoria de keywords real."}}],"executive_summary":"Rei do Pano & Rainha Modas tem 28,5 em 100 de maturidade digital — Baixo, segundo o framework de scoring da V4, e consistente com a classificação que o próprio material do projeto já usa: 'V0 — Estruturação'. Na prática, isso significa que o grupo está deixando dinheiro na mesa não porque falte estratégia — o Manual de Marca, a Landing Page e o forecast de mídia já estão prontos — mas porque a fundação técnica que faz qualquer real investido em anúncio valer mais amanhã do que hoje (Pixel, GTM, GA4) simplesmente não existe. Cada real gasto em mídia paga sem essa fundação é dinheiro pago para o algoritmo aprender do zero, de novo, na próxima campanha.\n\nOs dois maiores gaps que travam resultado agora: primeiro, o pilar de Mídia Paga (15/100, Crítico) — zero Pixel, zero GTM, zero GA4, zero histórico de campanha em ambas as marcas, confirmado tanto no briefing quanto no fetch direto do V4MOS (0 campanhas entre 12/06 e 10/09/2026) — mesmo com a estrutura de campanhas, o forecast (R$2.000/mês) e os criativos do Rei do Pano já prontos para subir. Segundo, o CRM (14/100, Crítico) — o Linx é citado como ERP/PDV mas seu uso formal nunca foi confirmado no pré-kick-off, não há nenhuma integração com o funil de mídia, e não existe pipeline, scripts ou régua de follow-up: hoje, todo 'cliente atendido' reportado é estimativa manual da equipe, não dado de sistema.\n\nOs dois pontos fortes que precisam ser acelerados: o Google Meu Negócio, com nota 4,6/5,0 e mais de 327 avaliações, é o único pilar com sinal de mercado forte e comprovado em todo o diagnóstico — e segue amplamente subaproveitado (SEO geral em 29/100, puxado só por esse ativo). E a Landing Page (CRO, 46/100, o pilar mais alto do diagnóstico), publicada com 14 blocos — mais completa que o planejamento original — já reúne proposta de valor clara, prova social forte e formulário de cotação; falta apenas confirmar os eventos de conversão no Pixel/GTM para que ela pare de ser uma vitrine e passe a ser, de fato, mensurável.","priorities":[{"rank":1,"action":"Instalar Pixel Meta + Google Tag Manager + GA4 nas duas marcas, com evento Contact disparado no clique do WhatsApp","rationale":"É o pré-requisito não-negociável citado de forma independente em três fontes (diagnóstico de mídia, auditoria de comunicação, handoff) — sem ele, qualquer real investido em anúncio entra 'no escuro' e o algoritmo nunca aprende com dado real.","effort":"medium","pillar":"midia_paga","dependencies":["Confirmação de que as contas Meta Business Manager e Google Ads foram criadas"]},{"rank":2,"action":"Subir a primeira campanha 'Lead via WhatsApp' (Meta, público frio, segmentação 120km/mulheres 30-60/interesses costura-moda) usando os 3 criativos já finalizados do Rei do Pano","rationale":"Caminho de menor fricção para o estágio V0 — não depende de pixel/LP maduros, aproveita ativos já prontos e gera o primeiro dado real para recalibrar o forecast de R$2.000/mês.","effort":"low","pillar":"midia_paga","dependencies":["Pixel Meta e GTM instalados (prioridade 1)"]},{"rank":3,"action":"Confirmar formalmente se o Linx é o ERP em uso nas 3 lojas + Rainha Modas e estruturar um pipeline comercial mínimo com critério de avanço","rationale":"CRM está em 14/100 — sem essa confirmação, a promessa de reativação da base de clientes (o ativo mais valioso subutilizado do grupo) não tem viabilidade técnica comprovada, e nenhuma venda pode ser atribuída à mídia de forma confiável.","effort":"high","pillar":"crm","dependencies":["Acesso direto ao Linx","Financeiro/TI do cliente"]},{"rank":4,"action":"Corrigir os 6 problemas técnicos recorrentes dos Reels (música, marca d'água do CapCut, edição abrupta, formato horizontal, sem texto na tela, sem legenda) e finalizar os criativos pagos pendentes da Rainha Modas","rationale":"O volume de produção já é bom — o ganho rápido está em execução, não em produzir mais; e a Rainha Modas não pode subir mídia paga sem ter nenhum criativo finalizado.","effort":"low","pillar":"criativos","dependencies":[]},{"rank":5,"action":"Confirmar quais eventos de conversão (clique WhatsApp, envio de formulário) estão de fato configurados no Pixel/GTM da Landing Page","rationale":"Sem essa confirmação, a LP (o pilar mais maduro do diagnóstico, 46/100) não pode provar sua própria conversão nem alimentar o algoritmo do Meta/Google com dado de qualidade.","effort":"low","pillar":"cro","dependencies":["Pixel/GTM instalado (prioridade 1)"]},{"rank":6,"action":"Otimizar o Google Meu Negócio (categoria, posts semanais, perguntas e respostas, fotos) para aproveitar o único ativo com sinal de mercado forte já comprovado","rationale":"GMB (4,6/5,0, 327+ avaliações) é o pilar mais forte do diagnóstico e o de menor esforço para melhorar — está sendo deixado praticamente parado enquanto puxa sozinho o pilar de SEO.","effort":"low","pillar":"seo","dependencies":[]}],"sector_benchmark":{"sector":"Varejo físico","sector_average":30,"comparison":"at_average","pillar_comparison":[{"pillar":"midia_paga","client_score":15,"sector_average":30,"gap":-15,"position":"critical_gap"},{"pillar":"criativos","client_score":34,"sector_average":28,"gap":6,"position":"above"},{"pillar":"cro","client_score":46,"sector_average":38,"gap":8,"position":"above"},{"pillar":"crm","client_score":14,"sector_average":25,"gap":-11,"position":"below"},{"pillar":"seo","client_score":29,"sector_average":40,"gap":-11,"position":"below"}],"key_insight":"O score geral (28,5) fica perto da média de Varejo Físico (30) — mas essa proximidade esconde o quadro real: Mídia Paga está 15 pontos abaixo até desse piso já baixo (0 campanhas rodadas), e CRM está 11 pontos abaixo. O que segura a média são CRO e Criativos, acima de benchmarks aproximados (o framework de scoring não lista 'Varejo Físico' para esses dois pilares; usamos Lead Gen/Serviços e Serviços Locais como proxy mais próximo), puxados por uma Landing Page e um Manual de Marca já entregues — trabalho de posicionamento que a maioria das contas V0 nesse estágio ainda não tem."},"key_insight":{"headline":"Ausência total de Pixel/GTM/GA4 é o gargalo sistêmico: sem rastreamento, Mídia Paga (15/100) não pode aprender e a Landing Page (CRO, 46/100) não consegue provar a própria conversão.","context":"As duas marcas partem de maturidade digital zero em rastreamento — nenhum evento é capturado hoje, nem pelo Meta nem pelo Google, nem na própria Landing Page. Isso não é um problema pontual de um pilar: é o pré-requisito do qual dependem a estrutura de campanhas já modelada, os 3 criativos prontos do Rei do Pano e a copy completa de Google Ads para funcionar de verdade.","numbered_reasons":["(1) Pixel Meta, GTM e GA4 não instalados em nenhuma das duas marcas — confirmado pelo briefing e pelo fetch V4MOS (0 campanhas, 12/06–10/09/2026).","(2) Sem esse rastreamento, mesmo a Landing Page já publicada (CRO, o pilar mais maduro do diagnóstico) não consegue confirmar quais eventos de conversão estão de fato disparando.","(3) Instalar essa camada é o único pré-requisito de custo zero — depois dele, a estrutura de campanhas, o forecast de R$2.000/mês e os criativos já prontos podem começar a gerar dado real em vez de estimativa."],"discussion_anchor":"Antes de decidir qualquer aumento de verba de mídia ou aprovar novos criativos, o stakeholder precisa priorizar a instalação de Pixel/GTM/GA4 — é o ponto que trava a leitura confiável de todos os outros pilares."},"honesty_alert":"3 dos 5 pilares estão na faixa Crítica ou Baixa (Mídia Paga 15, CRM 14, SEO 29) e nenhum pilar chega a 'Bom' — o diagnóstico confirma a classificação 'V0 — Estruturação' que o próprio material do projeto já usa, sem espaço para otimismo prematuro. O único ativo com sinal de mercado forte e comprovado é o GMB (4,6/5,0, 327+ avaliações) — isolado, não é suficiente para sustentar aquisição digital sozinho. Nenhum CPL/CAC/ROAS de mídia paga reportado neste ou em qualquer outro documento do projeto é dado real: o histórico é zero, e o forecast de R$2.000/mês é simulação [E], não resultado de campanha. Além disso, não existe ticket médio, margem nem faturamento confirmados — mesmo que o funil de mídia funcione tecnicamente, é impossível hoje validar se o CAC resultante será lucrativo."},"ee-s1-persona-icp":{"client_name":"Rei do Pano & Rainha Modas","summary":"O ICP do grupo cobre dois perfis B2C nomeados com JTBD completo — Dona Aparecida (48 anos, Rei do Pano, tecidos/casa) e Camila (35 anos, Rainha Modas, moda) — mais um segmento B2B de profissionais têxteis (costureiras, ateliês, tapeçarias) sem persona nomeada com a mesma profundidade. Ambas as personas B2C já estão no nível 3 da escada de consciência (sabem que precisam comprar, não decidiram onde) e a dor mais recorrente nas duas é desconhecimento de que as marcas anunciam online — não falta de produto, crediário ou atendimento. Dados financeiros (ticket médio, faturamento, margem) permanecem ausentes em todas as fontes consultadas, inclusive em pesquisa pública feita em 13/09/2026.","summary_headline":"Dona Aparecida usa o crediário do Rei do Pano há 5 anos e nem sabe que a marca anuncia online — o gargalo do ICP não é produto, crediário ou preço: é descoberta.","summary_highlights":[{"category":"posicao","label":"Personas nomeadas","value":"Dona Aparecida (48) e Camila (35)","subtext":"Rei do Pano (tecidos/casa) e Rainha Modas (moda), classes B/C","tone":"blue"},{"category":"competicao","label":"B2B sem persona própria","value":"Gap reconhecido na fonte","subtext":"Profissionais têxteis sem JTBD com a mesma profundidade","tone":"yellow"},{"category":"janela","label":"Nível de consciência","value":"Nível 3 — Consciente da Solução","subtext":"Já sabe que quer comprar, não decidiu onde","tone":"blue"},{"category":"oportunidade","label":"Crescimento B2B","value":"Aviamentos +57% YoY","subtext":"Único termo de busca com crescimento expressivo","tone":"green"},{"category":"risco","label":"Dado financeiro ausente","value":"Ticket médio / faturamento: não informado","subtext":"Confirmado ausente até em pesquisa pública (13/09/2026)","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O crediário próprio sem juros (inadimplência de apenas 1,5%-2,5%) já resolve o job funcional das duas personas B2C e é o único diferencial que nenhum concorrente nacional ou e-commerce replica digitalmente."},{"category":"contexto","text":"O público principal de ambas as marcas está no nível 3 da escada de consciência (Awareness Ladder) — já sabe que quer comprar, ainda não decidiu onde — o que prioriza campanhas de captura de intenção e reengajamento sobre criação de desejo do zero."},{"category":"ameaca","text":"A persona Dona Aparecida não sabe que o Rei do Pano anuncia online e só descobre a marca passando na frente da loja ou por indicação — um problema de descoberta agravado pela ausência de Pixel/GTM (maturidade V0), que impede medir onde esse lead se perde."},{"category":"acao","text":"Nomear persona e JTBD do segmento B2B (profissionais têxteis) com a mesma profundidade das personas B2C — gap explicitamente reconhecido em base-de-conhecimento/01-persona-icp-jtbd.md e listado como pendência no handoff de conta."}],"icp":{"demographics":{"type":"mixed","age_range":"ICP amplo (Briefing Mestre): 35-60 anos. Persona-âncora Rei do Pano: 48 anos ('Dona Aparecida'). Persona-âncora Rainha Modas: 35 anos ('Camila'). Segmento B2B: faixa etária não documentada na fonte.","income_or_revenue":"Classes B/C nas duas marcas B2C. Segmento B2B: faturamento/porte não documentado — apenas descrito qualitativamente como 'pequeno porte' (ateliês, confecções pequenas).","location":"Vilhena/RO (sede) + filiais Rei do Pano em Colorado do Oeste e Cerejeiras. Área de influência de ~180 mil habitantes num raio de 120 km.","company_size":"unavailable_reason: segmento B2B (costureiras autônomas, ateliês, tapeçarias, confecções de pequeno porte) descrito qualitativamente na fonte, sem número de funcionários ou faturamento associado.","decision_maker_role":"B2C: a própria cliente decide a compra (rotina doméstica ou pessoal), sem processo de comitê. B2B: dono(a)/responsável do ateliê, tapeçaria ou confecção decide a compra de matéria-prima — cargo específico não detalhado na fonte.","education":"unavailable_reason: nível de escolaridade não documentado nas fontes para nenhum dos dois perfis B2C nem para o segmento B2B.","other":{"rei_do_pano_b2c":"Dona Aparecida — 48 anos, Vilhena/RO, classe C, casada, 2 filhos, dona de casa e auxiliar administrativo, compra 3-4x/ano, usa o crediário próprio há mais de 5 anos.","rainha_modas_b2c":"Camila — 35 anos, Vilhena/RO, classe B/C, professora, solteira, segue perfis de moda no Instagram, compra 1-2x/mês, usa cartão mas prefere parcelar sem juros.","segmento_b2b":"Costureiras autônomas, ateliês de costura, tapeçarias automotivas e de móveis, alfaiates, confecções de pequeno porte e cortineiras — compram tecidos de alto padrão, tricoline, aviamentos. Alta concentração desse perfil em Vilhena e região. Sem persona nomeada nem JTBD estruturado com a mesma profundidade das personas B2C — gap identificado explicitamente na fonte (base-de-conhecimento/01-persona-icp-jtbd.md, seção 6)."}},"behavior":{"decision_process":"B2C: decisão individual, guiada por prova social (ver vizinhas/amigas usando o produto) e pela confiança já construída no crediário próprio; mais racional/planejada no Rei do Pano (renovação de casa) e com componente emocional mais forte na Rainha Modas (moda/autoestima). B2B: decisão do próprio profissional ou dono do negócio, baseada em condições comerciais (preço e prazo para cliente profissional).","research_channels":["Instagram (perfis de moda seguidos por Camila/Rainha Modas)","Indicação boca a boca / vizinhas e conhecidas (Rei do Pano)","Passagem física em frente à loja","WhatsApp, quando decide tirar dúvida antes de ir até a loja"],"main_objections":["Rei do Pano: \"Posso comprar por WhatsApp mesmo? E o crediário, funciona assim?\"","Rei do Pano: \"Será que o produto que vi no anúncio está disponível mesmo na loja?\"","Rei do Pano: \"Prefiro ver pessoalmente antes de decidir o tecido.\"","Rainha Modas: \"A Rainha Modas tem moda atualizada ou é mais básica/tradicional?\"","Rainha Modas: \"Os preços são competitivos com as lojas online?\"","Rainha Modas: \"Vocês têm meu número? Como funciona o crediário para quem ainda não tem cadastro?\""],"switching_triggers":"A fonte não detalha um gatilho específico de troca de fornecedor — descreve apenas a ameaça estrutural de showrooming: a cliente experimenta o tecido/produto fisicamente na loja, mas finaliza a compra em marketplaces nacionais (Shopee/Shein) quando julga mais barato ou mais prático.","purchase_frequency":"Rei do Pano ('Dona Aparecida'): 3 a 4 vezes por ano. Rainha Modas ('Camila'): 1 a 2 vezes por mês. Segmento B2B: descrito como 'alta frequência e volume', sem número exato documentado."},"jobs":{"functional":"Rei do Pano ('Dona Aparecida'): Quando precisa renovar o enxoval, comprar tecido para costurar ou montar o ambiente da casa, ela quer encontrar os melhores tecidos e produtos de casa com crédito acessível, para que consiga fazer isso sem comprometer o orçamento — o crediário próprio sem juros é o que nenhum concorrente regional consegue igualar. Rainha Modas ('Camila'): Quando quer renovar o guarda-roupa, ela quer se vestir bem sem pagar caro e sem complicação, para que o parcelamento sem juros do crediário próprio resolva o mesmo job funcional que no lar — sem burocracia, com um limite que ela já conhece e confia.","emotional":"Rei do Pano: ela quer sentir que está cuidando bem do seu lar e da sua família — a compra é um ritual de cuidado, e ela quer sair da loja com a sensação de que fez uma boa escolha e foi bem atendida. Rainha Modas: ela quer se sentir bonita, atualizada e confiante — moda é autoestima, e ela quer ser atendida por alguém que entende do produto e ajuda a escolher, não uma gôndola de autoatendimento.","social":"Rei do Pano: ela quer ser reconhecida como alguém que cuida da casa com bom gosto — o enxoval bonito e o tecido certo para a costura são formas de expressar identidade diante das visitas. Rainha Modas: ela quer ser vista como alguém que se cuida e acompanha as tendências — em cidade menor, 'o que você está usando' tem peso social alto, e ela quer o comentário 'onde você comprou?'."},"pains":[{"pain":"[Rei do Pano] Não sabe que a Rei do Pano anuncia online — só entra na loja quando passa na frente ou alguém indica.","intensity":"critical","current_workaround":"Só descobre a loja fisicamente (passando na frente) ou por indicação de conhecidos; não associa a marca a anúncios digitais."},{"pain":"[Rei do Pano] Vê produtos no Instagram de outras lojas de fora, mas não confia na entrega e no pós-venda.","intensity":"high","current_workaround":"Evita concluir compra fora da região mesmo quando o produto parece interessante no feed."},{"pain":"[Rei do Pano] Tem medo de parcelar no cartão de crédito — prefere o crediário, mas não sabe como funciona pelo WhatsApp.","intensity":"high","current_workaround":"Prefere resolver dúvidas de crediário presencialmente em vez de usar o WhatsApp."},{"pain":"[Rainha Modas] Compra em lojas online de fora, mas se arrepende quando o produto chega diferente do esperado.","intensity":"high","current_workaround":"Continua comparando online mesmo após experiências ruins, por falta de opção percebida na região."},{"pain":"[Rainha Modas] Sente que as opções de moda em Vilhena são limitadas e sem novidade frequente.","intensity":"medium","current_workaround":"Acompanha perfis de moda no Instagram para compensar a sensação de falta de novidade local."}],"gains":[{"gain":"[Rei do Pano] Ver as novidades de tecido, cama, mesa e banho sem precisar ir à loja toda semana.","type":"tangible"},{"gain":"[Rei do Pano] Conseguir fazer uma compra pelo WhatsApp e parcelar no crediário sem complicação.","type":"tangible"},{"gain":"[Rei do Pano] Sentir que a loja 'pensa nela' com produto e preço personalizados.","type":"intangible"},{"gain":"[Rainha Modas] Ver looks completos com sugestão de combinação — não só a peça isolada.","type":"tangible"},{"gain":"[Rainha Modas] Parcelar sem juros em uma loja local de confiança, sem depender de cartão.","type":"tangible"}]},"persona":{"name":"Dona Aparecida (Rei do Pano)","photo_description":"unavailable_reason: nenhuma descrição visual (idade aparente, expressão, vestuário, contexto de foto) foi produzida nos documentos-fonte para esta persona — a Estruturação de Tráfego Pago documenta apenas dados demográficos e JTBD, sem briefing de imagem.","story":"Aos 48 anos, Dona Aparecida mora em Vilhena (RO), é casada e mãe de 2 filhos, e concilia o papel de dona de casa com um trabalho de auxiliar administrativo. Compra na Rei do Pano de 3 a 4 vezes por ano e usa o crediário próprio da loja há mais de 5 anos — mas fora dessas idas presenciais, não sabe que a marca também anuncia online: só entra na loja quando passa na frente ou quando alguém indica, e fica sem saber das novidades de tecido e enxoval entre uma visita e outra. Vê produtos de outras lojas no Instagram, mas não confia na entrega nem no pós-venda de quem não conhece, e tem receio de comprar pelo WhatsApp sem entender direito como o crediário funcionaria por esse canal. Ela quer renovar o enxoval ou encontrar o tecido certo para costurar sem comprometer o orçamento da casa, e o crediário sem juros — que ela já usa e em que já confia — é o que resolve isso sem a burocracia do cartão de crédito.","quote":"Posso comprar por WhatsApp mesmo? E o crediário, funciona assim?"},"_nota_estrutura_publico":"O schema desta skill prevê um único objeto 'persona'. Como o ICP real do grupo cobre DUAS marcas com personas B2C nomeadas distintas mais um segmento B2B, a persona principal acima (Dona Aparecida, Rei do Pano) é complementada pelos campos adicionais 'persona_secundaria_rainha_modas' e 'segmento_b2b_perfil' logo abaixo, para preservar a estrutura completa sem simplificar para uma persona só.","persona_secundaria_rainha_modas":{"name":"Camila (Rainha Modas)","photo_description":"unavailable_reason: nenhuma descrição visual (idade aparente, expressão, vestuário, contexto de foto) foi produzida nos documentos-fonte para esta persona — a Estruturação de Tráfego Pago documenta apenas dados demográficos e JTBD, sem briefing de imagem.","story":"Aos 35 anos, Camila é professora, solteira, mora em Vilhena (RO) e segue perfis de moda no Instagram. Compra roupas de 1 a 2 vezes por mês, prefere pagar no cartão mas busca sempre parcelar sem juros. Hoje ela associa mais o grupo à loja de tecidos do que à moda, sente que as opções de moda em Vilhena são limitadas e sem novidade frequente, e já comprou em lojas online de fora — se arrependendo quando o produto chegou diferente do esperado. Ela quer ser atendida por alguém que entende de moda, não por uma atendente que só registra a venda, e às vezes sente vergonha de entrar numa loja e sair sem comprar nada.","quote":"A Rainha Modas tem moda atualizada ou é mais básica/tradicional?"},"segmento_b2b_perfil":{"description":"Segmento B2B do grupo (aplicável majoritariamente ao Rei do Pano), sem persona nomeada nem JTBD com a mesma profundidade das personas B2C — gap reconhecido explicitamente na fonte (base-de-conhecimento/01-persona-icp-jtbd.md, seção 6: 'Não há persona nomeada/JTBD estruturado para o segmento B2B').","quem_sao":"Costureiras autônomas, ateliês de costura, tapeçarias automotivas e de móveis, alfaiates, confecções de pequeno porte e cortineiras. Alta concentração desse perfil em Vilhena e região.","dor_principal":"Margem de lucro apertada e dificuldade de encontrar fornecedores variados na mesma região.","gatilho_de_compra":"Condições diferenciadas (preço e prazo) para cliente profissional.","por_que_sao_valiosos":"Compram em volume, com alta frequência, em categorias específicas (tricoline, percal, tecido automotivo, aviamentos). Ticket médio maior e fidelidade alta quando a loja tem estoque consistente e crédito disponível.","como_abordar_no_trafego_pago":"Segmentação por interesse profissional (costura, decoração, artesanato) e por cargo/atividade. Criativos com produto específico do nicho (aviamentos, tecidos técnicos) e chamada direta para o WhatsApp com proposta de conta profissional."},"where_to_find":{"digital_channels":["Instagram @reidopano.com.br (Rei do Pano) e @rainhamodas.com.br (Rainha Modas) — perfis próprios por marca","WhatsApp como central de atendimento (em estruturação no momento do briefing)","Google Meu Negócio — nota 4,6/5,0 com mais de 327 avaliações","Segmentação por interesse profissional (costura, decoração, artesanato) no Meta Ads, recomendada para alcançar o público B2B"],"keywords":["tecidos por metro em Vilhena — categoria com ~410 buscas/mês combinadas no Google e zero concorrentes anunciando (fonte: client.json, research.market)","aviamentos — único termo de busca do segmento B2B com crescimento expressivo de +57% YoY (fonte: client.json, product.growth_potential)"],"influencers":["Influenciadora local já utilizada no conteúdo orgânico do Rei do Pano — não nomeada nos materiais-fonte (fonte: handoff-account-manager.md, seção 15)"],"communities":["Rede de indicação boca a boca entre vizinhas e conhecidas (Rei do Pano)","Costureiras autônomas, ateliês, tapeçarias automotivas e de móveis, alfaiates, confecções de pequeno porte e cortineiras concentrados em Vilhena e região (segmento B2B profissional)"]},"buyer_journey":{"description":"Jornada reconstruída a partir da Escada de Consciência (Awareness Ladder) documentada em base-de-conhecimento/01-persona-icp-jtbd.md e da 'Jornada de venda' / 'Jornada digital' descritas em handoff-account-manager.md (seções 6 e 17). Não há, na fonte, dado de duração típica por etapa — campo omitido onde ausente.","stages":[{"stage":"Gatilho (Não Consciente / Consciente do Problema)","trigger":"Necessidade de renovar enxoval/casa ou comprar tecido pontual (Rei do Pano), ou vontade de renovar o guarda-roupa (Rainha Modas).","mental_state":"Necessidade latente ainda não direcionada a uma marca específica ('Público Frio', nível 1-2 da escada de consciência).","primary_channel":"Rotina doméstica/pessoal, sem canal digital ativo nesta fase.","dominant_question":"Preciso resolver isso — mas onde?","client_intervention":"Nenhuma intervenção digital ativa mapeada nesta fase na fonte.","friction_today":"A persona não associa a necessidade a nenhuma comunicação da marca, porque o Instagram é usado como 'panfleto de preços', sem estratégia."},{"stage":"Consciente da Solução (Público Principal)","trigger":"Já sabe que precisa comprar tecido, renovar o enxoval ou se vestir melhor — falta decidir onde.","mental_state":"Nível 3 da escada de consciência — decisão em aberto, sem urgência criada artificialmente.","primary_channel":"Instagram, indicação boca a boca, passagem física em frente à loja.","dominant_question":"Onde eu compro isso com confiança e crediário fácil?","client_intervention":"Presença orgânica no Instagram (com identidade visual ainda inconsistente, segundo auditoria de comunicação) e Google Meu Negócio.","friction_today":"Dona Aparecida relata não saber que a Rei do Pano anuncia online — só descobre passando na frente da loja ou por indicação."},{"stage":"Primeiro contato","trigger":"Decide tirar dúvida sobre produto, disponibilidade ou crediário antes de ir até a loja.","mental_state":"Ansiedade/desconfiança sobre disponibilidade real do produto e sobre como o crediário funciona por canal digital.","primary_channel":"WhatsApp (central de atendimento descrita como 'em estruturação' no briefing).","dominant_question":"Posso comprar por WhatsApp mesmo? O crediário funciona assim?","client_intervention":"Atendimento via WhatsApp, sem SLA nem scripts formalizados (has_scripts: false, briefing).","friction_today":"Canal em estruturação, sem processo padronizado de resposta documentado."},{"stage":"Atendimento consultivo / Consideração","trigger":"Vai até a loja física para ver e tocar o produto antes de decidir.","mental_state":"Preferência por avaliar o tecido/produto pessoalmente antes de fechar.","primary_channel":"Loja física (Vilhena, Colorado do Oeste ou Cerejeiras).","dominant_question":"Este é mesmo o produto/qualidade que eu vi ou que preciso?","client_intervention":"Atendimento humanizado presencial, loja de 3.000 m² com elevador na sede.","friction_today":"Ameaça de showrooming: cliente experimenta o produto na loja física e pode finalizar a compra em marketplaces nacionais (Shopee/Shein)."},{"stage":"Decisão / Fechamento via crediário","trigger":"Decide fechar a compra usando o crediário próprio até 6x sem juros.","mental_state":"Confiança no crediário como instrumento que não compromete o limite do cartão de crédito.","primary_channel":"Atendimento presencial ou WhatsApp.","dominant_question":"Cabe no meu orçamento sem comprometer meu limite de cartão?","client_intervention":"Crediário próprio familiar, sem juros, em até 6x — inadimplência de 1,5% a 2,5%.","friction_today":"Nenhuma fricção específica documentada nesta etapa além da falta de clareza sobre como o crediário funciona por WhatsApp (ver etapa de Primeiro contato)."},{"stage":"Pós-compra / Recompra","trigger":"Nova necessidade surge após 3-4 meses (Rei do Pano) ou dentro do mesmo mês (Rainha Modas).","mental_state":"Cliente já convertida, nível 4 da escada de consciência ('Base Fiel') se estiver na base ativa, ou inativa se não recomprou recentemente.","primary_channel":"Base de clientes no sistema Linx (uso formal e cobertura das 3 lojas + Rainha Modas não confirmados).","dominant_question":"A loja vai lembrar de mim quando chegar a novidade que eu queria?","client_intervention":"Reativação da base de clientes inativos via Linx planejada (upload como audiência personalizada/lookalike no Meta Ads), mas não confirmada como operacional.","friction_today":"Linx citado como ERP/PDV em documentos posteriores ao pré-kick-off, mas uso formal, cobertura das 3 lojas + Rainha Modas e viabilidade de exportação (LGPD, formato, frequência) não confirmados."}],"critical_leakage_point":"O vazamento mais evidenciado na fonte está entre as etapas de Consciente da Solução e Primeiro Contato: a persona relata não saber que a Rei do Pano anuncia online e ficar sem novidades entre visitas à loja, enquanto a central de WhatsApp segue 'em estruturação', sem SLA nem scripts formalizados (has_scripts: false) — e a ausência de Pixel/GTM/GA4 (maturidade V0, confirmada em handoff-account-manager.md) impede hoje medir exatamente onde esse lead se perde entre o anúncio e o atendimento."},"willingness_to_pay":{"description":"unavailable_reason: nenhum dado de ticket médio, faixa de preço percebida como justa ou teto premium foi informado pelo cliente em nenhuma fonte consultada — client.json (briefing.product.ticket = null) e 00-empresa-e-contexto.md confirmam os campos de faturamento/ticket/margem deixados em branco no pré-kick-off; handoff-account-manager.md (seção 1) confirma essa ausência também em pesquisa pública realizada em 13/09/2026 ('não existe esse dado em nenhum registro ou fonte aberta'). As categorias de produto abaixo são reais (fonte: portfólio do grupo), mas sem nenhum dado de precificação associado.","services":[{"service":"Tecidos por metro (Rei do Pano)"},{"service":"Cama, mesa e banho (Rei do Pano)"},{"service":"Eletrodomésticos e utilidades domésticas (Rei do Pano)"},{"service":"Decoração e cortinas sob medida (Rei do Pano)","pricing_lever":"Categoria apontada como a mais rentável do grupo — margem elevada e posicionamento premium (fonte: client.json, briefing.product.most_profitable; handoff-account-manager.md, seção 5)."},{"service":"Roupas femininas, calçados e acessórios (Rainha Modas)"},{"service":"Aviamentos B2B (linha, zíper, botões, tecido técnico)","pricing_lever":"Maior potencial de crescimento do grupo — único termo de busca com crescimento expressivo de +57% YoY (fonte: client.json, briefing.product.growth_potential)."}]},"key_message":{"chosen_message":"Parcele em até 6x sem juros no crediário próprio — sem cartão, sem burocracia.","approach":"functional","usage_context":"Ancoragem de toda comunicação de aquisição (anúncios, WhatsApp, headline de landing page) — o handoff de conta reforça explicitamente que 'toda comunicação de aquisição deve ancorar nele [crediário] antes de qualquer outro atributo' (handoff-account-manager.md, seção 11). Nota: esta escolha formaliza a ênfase estratégica já documentada de forma consistente em todas as fontes da conta; não há registro de uma decisão interativa formal desta mensagem específica com o operador dentro do fluxo desta skill.","alternatives":[{"message":"Parcele em até 6x sem juros no crediário próprio — sem cartão, sem burocracia.","approach":"functional","rationale":"É o único diferencial estrutural que nenhum concorrente nacional (Havan) ou e-commerce (Shopee/Shein) consegue replicar digitalmente — inadimplência de apenas 1,5%-2,5% comprova a solidez da relação de confiança."},{"message":"Aqui você é atendida com o carinho de quem te conhece há mais de 30 anos.","approach":"emotional","rationale":"Reflete o Job Emocional das duas personas (sentir-se cuidada / sentir-se confiante), mas é um território também reivindicado por concorrentes regionais como Lojas Avenida ('proximidade'), tornando-o menos exclusivo que o crediário."},{"message":"Leve para casa o tecido (ou o look) que todo mundo vai notar.","approach":"social","rationale":"Reflete o Job Social das duas personas (ser vista com bom gosto / estar antenada), mas depende de prova visual (fotos, criativos) que hoje tem gaps de execução documentados na auditoria de comunicação (04-auditoria-comunicacao-redes-sociais.md)."}]},"key_insight":{"headline":"O público de ambas as marcas já está no nível 3 de consciência — sabe que quer comprar, só não decidiu onde — mas a Rei do Pano só é descoberta quando a cliente passa na frente da loja, porque a marca nunca apareceu para ela no digital.","context":"As personas nomeadas (Dona Aparecida, Rei do Pano; Camila, Rainha Modas) revelam que a maior dor não é preço, variedade ou crediário — é desconhecimento de que o grupo já resolve exatamente o problema delas. O crediário próprio sem juros, com mais de 30 anos de relação de confiança, é o diferencial que nenhum concorrente replica, mas hoje só é descoberto presencialmente.","numbered_reasons":["(1) O público principal (nível 3 — Consciente da Solução) já sabe que precisa comprar; a comunicação não precisa criar desejo do zero, só aparecer como escolha óbvia (fonte: 01-persona-icp-jtbd.md, seção 4).","(2) A dor mais citada nas duas personas é não saber que a marca anuncia online / não receber novidades entre visitas — um problema de descoberta, não de produto ou preço.","(3) O crediário próprio (inadimplência de apenas 1,5%-2,5%) já resolve o job funcional de ambas as personas, mas a comunicação atual ('Instagram como panfleto de preços') não comunica isso de forma consistente."],"discussion_anchor":"Ponto para validar com Luiz/Terezinha: antes de escalar verba de mídia, vale confirmar se o gargalo real é aquisição (gerar desejo do zero) ou descoberta/lembrança (a base já existe e já confia no crediário, só não sabe que pode comprar pelo WhatsApp) — isso muda a prioridade entre campanhas de topo de funil e reativação da base Linx."},"honesty_alert":"Este output tem duas fragilidades herdadas diretamente da fonte, preservadas aqui sem resolução arbitrária: (1) o segmento B2B (profissionais têxteis) é tratado no ICP sem persona nomeada nem JTBD estruturado com a mesma profundidade dos perfis B2C — a própria fonte reconhece essa lacuna ('Não há persona nomeada/JTBD estruturado para o segmento B2B', base-de-conhecimento/01-persona-icp-jtbd.md, seção 6); (2) não existe nenhum dado de ticket médio, faturamento ou margem em nenhuma fonte, inclusive pesquisa pública de 13/09/2026, o que impede validar se o WTP real do ICP sustenta a meta de +30% em vendas em 12 meses. Adicionalmente, este output não inclui os blocos de anti-persona nem de objection_library com respostas testadas (bad_response/good_response), porque a fonte confirma explicitamente a ausência de scripts de vendas/atendimento formalizados (client.json: sales_module.has_scripts = false) e nenhum documento define quem é 'anti-cliente' para este grupo — preencher esses blocos exigiria inventar conteúdo inexistente na fonte, o que viola a regra de não-invenção desta formalização."},"ee-s1-swot":{"client_name":"Rei do Pano & Rainha Modas","summary":"Rei do Pano & Rainha Modas têm o diferencial mais defensável do varejo regional de Vilhena — crediário próprio sem juros, especialidade em tecidos sem concorrência direta e prova social de 4,6/5,0 com 327+ avaliações — mas entram no digital em maturidade V0 (zero Pixel/GTM/GA4, zero histórico de mídia paga), enquanto a Havan já opera anúncios em escala nacional.","summary_headline":"Rei do Pano tem crediário próprio e zero concorrência em tecidos, mas está em V0 digital enquanto a Havan roda +1.100 anúncios — a janela de CPC mínimo no Google segue aberta, mas não é permanente.","summary_highlights":[{"category":"posicao","label":"Forças vs fraquezas","value":"6 forças / 6 fraquezas","subtext":"Diferencial estrutural forte (crediário), execução digital ainda V0","tone":"yellow"},{"category":"competicao","label":"Scorecard geral (0-10) [E]","value":"Cliente 4,4 vs Havan 8,0","subtext":"Gap concentrado em mídia paga e tracking, não em diferencial de produto","tone":"red"},{"category":"oportunidade","label":"Zero concorrentes no Google","value":"~410 buscas/mês, 0 concorrentes anunciando","subtext":"CPC mínimo possível na 1ª posição nos termos de categoria","tone":"green"},{"category":"risco","label":"Maior ameaça","value":"Havan (megastore nacional)","subtext":"+1.100 anúncios Meta ativos, ~4.000 Google Ads ativos","tone":"red"},{"category":"janela","label":"Janela de CPC mínimo","value":"Aberta, mas não permanente","subtext":"Fecha assim que algum concorrente decidir disputar os termos","tone":"yellow"},{"category":"maturidade","label":"Maturidade digital","value":"V0 — Estruturação","subtext":"Zero Pixel/GTM/GA4, zero histórico de mídia paga nas 2 marcas","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O crediário próprio sem juros (até 6x, inadimplência de 1,5%-2,5%) é o diferencial estrutural que nem a Havan (sem crediário próprio) nem o e-commerce nacional conseguem replicar digitalmente."},{"category":"contexto","text":"O grupo entra no digital em maturidade V0 (zero Pixel Meta, GTM, GA4 e histórico de campanha paga em ambas as marcas), confirmado tanto pelo diagnóstico de maturidade quanto pelo fetch V4MOS (0 campanhas no período 12/06–10/09/2026)."},{"category":"ameaca","text":"A Havan, concorrente direto de porte nacional, já opera com Pixel/GTM/GA4 ativos, +1.100 anúncios ativos no Meta e ~4.000 no Google Ads — maturidade digital muito superior à do grupo, ainda que sem vínculo regional nem crediário próprio."},{"category":"acao","text":"Instalar o Pixel Meta via GTM e o GA4/GTM na Landing Page é o pré-requisito de custo zero mais crítico antes de escalar o piloto de mídia paga de R$2.000/mês já aprovado com o operador."}],"competitor_scorecard":[{"name":"Rei do Pano & Rainha Modas (cliente)","type":"cliente","scores":{"site":6,"seo":3,"midia_paga":0,"social":4,"gmn":7,"reputacao":8,"comunicacao":3},"evidence":{"site":"LP publicada em rei-do-pano.vercel.app com 14 blocos (hero, vantagens, prova social, FAQ, formulário de cotação) — estrutura completa e mais ampla que o planejado, mas sem confirmação de quais eventos de conversão estão de fato configurados no Pixel/GTM.","seo":"SEO orgânico não trabalhado — o Google Meu Negócio é hoje o único ativo de busca local do grupo (handoff, seção 16).","midia_paga":"briefing.digital_situation.paid_traffic: false e accesses.meta_business/google_ads: false; fetch V4MOS (12/06–10/09/2026) confirmou 0 campanhas em Google Ads e Facebook Ads.","social":"Volume de produção de conteúdo já bom (Reels frequentes, uso de influenciadora local — 'o esforço existe, falta a estratégia'), mas feed sem identidade visual consistente e Reels com 6 problemas técnicos recorrentes (auditoria de comunicação).","gmn":"Nota 4,6/5,0 com 327+ avaliações no Google Meu Negócio, mas otimização para busca local ainda incompleta (handoff, seção 16).","reputacao":"4,6/5,0 com 327+ avaliações somado a inadimplência baixíssima do crediário próprio (1,5%-2,5%), sinalizando relação de confiança sólida com a base de clientes.","comunicacao":"Instagram descrito nos materiais como 'extensão de panfleto de mercado', ausência de legenda na maioria dos posts, nome de usuário em formato de domínio (@reidopano.com.br) dificultando busca e memorização."},"overall":4.4},{"name":"Havan","type":"direto","scores":{"site":null,"seo":null,"midia_paga":9,"social":8,"gmn":null,"reputacao":null,"comunicacao":7},"evidence":{"site":"unavailable_reason: materiais não trazem avaliação específica da qualidade/estrutura do site da Havan — só a menção de que site e aplicativo funcionam como canal de conversão direto nos anúncios Meta (doc. Estruturação de Tráfego Pago).","seo":"unavailable_reason: presença de busca orgânica da Havan não foi auditada nos materiais disponíveis.","midia_paga":"Pixel Meta ativo (1 evento), Google Tag Manager ativo (GTM-MSRC), GA4 ativo (G-SDEH2SZNKR), Google Ads ativo (AW-985015144); +1.100 anúncios ativos no Meta Ads e ~4.000 anúncios ativos no Google Ads (Search, Display, Shopping, Vídeo e Local).","social":"Categoria de perfil 'Compras e Varejo' (a mesma recomendada para o Rei do Pano), proporção seguindo/seguidores muito favorável, estratégia de influenciadora (Camylla Miranda) para conteúdo gerado por consumidor e alcance orgânico.","gmn":"unavailable_reason: perfil de Google Meu Negócio da Havan não foi auditado nos materiais disponíveis.","reputacao":"unavailable_reason: reputação/avaliações da Havan não foram auditadas nos materiais disponíveis.","comunicacao":"Posicionamento de megastore nacional (moda, casa, eletro, ferramentas e mais), imagem do dono (Luciano Hang) fortemente associada à marca, experiência de loja física como destino de passeio."},"overall":8.0},{"name":"Lojas Avenida","type":"indireto","scores":{"site":null,"seo":null,"midia_paga":6,"social":8,"gmn":null,"reputacao":null,"comunicacao":5},"evidence":{"site":"unavailable_reason: site da Lojas Avenida não foi auditado especificamente nos materiais disponíveis.","seo":"unavailable_reason: presença de busca orgânica não auditada; Google Tag Manager (2 containers) e GA4 (2 proprie .","reputacao":"unavailable_reason: benchmark de criativo, não concorrente confirmado — sem dado de reputação."},"overall":null},{"name":"JLM Tecidos","type":"aspiracional","note":"Benchmark de criativo citado na Análise de Social Media, NÃO classificado como concorrente direto/indireto nos materiais-fonte.","scores":{"site":null,"seo":null,"midia_paga":null,"social":null,"gmn":null,"reputacao":null,"comunicacao":null},"evidence":{"comunicacao":"[Benchmark de criativo, não concorrente confirmado] Anúncio de demonstração de produto (sarja impermeável): prova visual do atributo físico do tecido em ação nos primeiros segundos, antes da prova verbal.","site":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de site.","seo":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de busca orgânica.","midia_paga":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de investimento em mídia.","social":"unavailable_reason: análise limitada a 1 anúncio de demonstração de produto, não a auditoria de perfil completa.","gmn":"unavailable_reason: não aplicável — benchmark de criativo, não concorrente confirmado.","reputacao":"unavailable_reason: benchmark de criativo, não concorrente confirmado — sem dado de reputação."},"overall":null},{"name":"Mundo do Enxoval","type":"aspiracional","note":"Benchmark de criativo citado na Análise de Social Media, NÃO classificado como concorrente direto/indireto nos materiais-fonte.","scores":{"site":null,"seo":null,"midia_paga":null,"social":null,"gmn":null,"reputacao":null,"comunicacao":null},"evidence":{"comunicacao":"[Benchmark de criativo, não concorrente confirmado] Estático 'Outlet Cama, Mesa e Banho' (60% off): hierarquia visual em blocos (categoria → oferta → marca), paleta neutra que não parece liquidação barata.","site":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de site.","seo":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de busca orgânica.","midia_paga":"unavailable_reason: benchmark de criativo pontual, não concorrente confirmado — sem auditoria de investimento em mídia.","social":"unavailable_reason: análise limitada a 1 peça estática, não a auditoria de perfil completa.","gmn":"unavailable_reason: não aplicável — benchmark de criativo, não concorrente confirmado.","reputacao":"unavailable_reason: benchmark de criativo, não concorrente confirmado — sem dado de reputação."},"overall":null},{"name":"comercialtextilstore","type":"aspiracional","note":"Benchmark de perfil editorial citado na Análise de Social Media, NÃO classificado como concorrente direto/indireto nos materiais-fonte.","scores":{"site":null,"seo":null,"midia_paga":null,"social":null,"gmn":null,"reputacao":null,"comunicacao":null},"evidence":{"comunicacao":"[Benchmark de criativo/perfil, não concorrente confirmado] Perfil de referência para linha editorial de tecidos: estrutura de temas (tapetes, cortinas, enxovais) como categorias reais buscadas pelo cliente.","site":"unavailable_reason: benchmark de perfil editorial, não concorrente confirmado — sem auditoria de site.","seo":"unavailable_reason: benchmark de perfil editorial, não concorrente confirmado — sem auditoria de busca orgânica.","midia_paga":"unavailable_reason: benchmark de perfil editorial, não concorrente confirmado — sem auditoria de investimento em mídia.","social":"unavailable_reason: análise limitada à estrutura de temas do perfil, não a uma auditoria completa (seguidores, frequência, engajamento).","gmn":"unavailable_reason: não aplicável — benchmark de criativo, não concorrente confirmado.","reputacao":"unavailable_reason: benchmark de criativo, não concorrente confirmado — sem dado de reputação."},"overall":null}],"strengths":[{"title":"Crediário próprio, familiar, sem juros — ativo estrutural não replicável digitalmente","description":"Parcelamento em até 6x sem juros, com inadimplência de apenas 1,5%-2,5% — indicando relação de confiança sólida com a base. Nem a Havan (depende 100% de cartão de terceiros) nem o e-commerce nacional (Shopee, Shein) replicam esse modelo.","implication":"Deve ser o argumento central de qualquer comunicação de aquisição, ancorado antes de qualquer outro atributo — é o diferencial verdadeiramente defensável do grupo.","source":"briefing"},{"title":"Referência regional consolidada há 30+ anos, sem concorrência direta em tecidos por metro","description":"Saturação do nicho de tecidos em Vilhena é baixa — o Rei do Pano não enfrenta concorrência direta nesse segmento específico, ao contrário do nicho de moda popular (saturação média, disputado com Lojas Avenida).","implication":"Permite investir em mídia paga sem guerra de preço no segmento principal — a estratégia pode focar em capturar demanda latente, não em disputar por desconto.","source":"briefing"},{"title":"Prova social forte já construída, ainda pouco explorada digitalmente","description":"Nota 4,6/5,0 no Google Meu Negócio, com mais de 327 avaliações — ativo de confiança relevante que hoje aparece pouco na comunicação ativa das duas marcas.","implication":"Amplificar essa prova social nos destaques do Instagram, na Landing Page e nos criativos de mídia paga tem custo baixo e retorno direto em confiança na fase de consideração.","source":"briefing"},{"title":"Estrutura física robusta e presença em 3 unidades no Cone Sul","description":"Loja sede de 3.000 m² com elevador, mais unidades em Colorado do Oeste e Cerejeiras — porte físico relevante numa região onde poucos concorrentes oferecem escala equivalente, somado à possibilidade de visualização e tato físico do produto antes da compra.","implication":"Reforça o argumento de 'loja destino' contra concorrentes de autoatendimento, e sustenta a narrativa de variedade completa em um só lugar.","source":"briefing"},{"title":"Volume de produção de conteúdo orgânico já existente — esforço presente, falta só estratégia","description":"Reels frequentes nas duas marcas e uso de influenciadora local já em prática, segundo a auditoria de comunicação — o volume de captação é considerado ponto forte real, mesmo com problemas de execução técnica.","implication":"A correção é de execução (formato, legenda, edição), não de esforço ou investimento adicional em produção — ganho rápido e de baixo custo.","source":"diagnostico"},{"title":"Atendimento humanizado com resolução de problemas sem burocracia","description":"A empresa absorve o prejuízo quando necessário; discurso interno de que 'o cliente é o nosso maior patrimônio' — coerente com 30+ anos de relacionamento e com a baixa inadimplência do crediário.","implication":"Diferencial defensável frente a redes nacionais de autoatendimento (Havan) e frente ao e-commerce, que não oferece esse tipo de resolução pessoal de problema.","source":"briefing"}],"weaknesses":[{"title":"Maturidade digital V0 (Estruturação) nas duas marcas","description":"Sem Pixel Meta instalado, sem Google Tag Manager, sem GA4 e sem histórico de campanhas pagas em nenhuma das duas marcas — confirmado tanto pelo briefing (`paid_traffic: false`) quanto pelo fetch V4MOS (0 campanhas no período 12/06–10/09/2026).","implication":"Sem correção, o algoritmo de mídia opera 'no escuro', elevando custo e reduzindo desempenho mesmo com verba aprovada — instalar o Pixel é a intervenção mais crítica antes de escalar qualquer investimento.","severity":"critical","source":"diagnostico"},{"title":"Feed do Instagram sem identidade visual consistente","description":"Mistura de estilos (arte gráfica de entrega, foto de produto, vídeo de influenciadora, cartaz de preço fotografado) — descrito nos próprios materiais como 'extensão de panfleto de mercado'.","implication":"Compromete a percepção de marca justamente no canal que já tem volume de produção — risco de continuar investindo esforço sem ganho de autoridade; mitigar com linha editorial e identidade visual formalizadas.","severity":"high","source":"diagnostico"},{"title":"Reels com 6 problemas técnicos recorrentes","description":"Marca d'água do CapCut, música desalinhada com o público, edições abruptas, formato horizontal em vez de vertical nativo, ausência de texto em tela e ausência de legenda/contexto na maioria dos posts.","implication":"Reduz alcance orgânico e credibilidade mesmo com bom volume de produção; risco de amplificar esses mesmos erros ao subir como criativo pago se não corrigidos antes.","severity":"medium","source":"diagnostico"},{"title":"Dados financeiros críticos ausentes (faturamento, ticket médio, margem atual)","description":"Campos deixados em branco no formulário de pré-kick-off e não localizados em nenhuma fonte pública — impede dimensionar com precisão metas de crescimento e orçamento de mídia.","implication":"Sem esse dado, qualquer CPL/CAC projetado não pode ser validado como lucrativo — é uma pendência que precisa ser resolvida diretamente com o financeiro do cliente antes de qualquer escala de investimento.","severity":"high","source":"briefing"},{"title":"Nome de usuário do Instagram em formato de domínio e baixa autoridade de perfil","description":"Handles @reidopano.com.br / rainhamodas.com.br dificultam busca e memorização; o Instagram do Rei do Pano tem proporção seguindo/seguidores desfavorável ('segue quase metade de quem te segue'), sinalizando baixa autoridade.","implication":"Troca de handle para formato limpo já foi recomendada internamente, mas confirmado que ainda não foi aplicada — correção rápida e de custo zero.","severity":"medium","source":"diagnostico"},{"title":"Base de clientes no Linx subutilizada e não confirmada como operacionalmente viável","description":"O sistema Linx é citado em documentos pós-briefing como ERP/PDV do grupo e como fonte para reativação de clientes inativos, mas o pré-kick-off original não confirma seu uso formal (respondeu apenas 'computador, celular' na pergunta sobre sistemas de gestão) — divergência não resolvida.","implication":"Antes de prometer prazo de reativação de base ao cliente, é preciso confirmar se o Linx é de fato o sistema em uso nas 3 lojas + Rainha Modas e se a exportação de dados é viável (formato, LGPD, frequência) — sem isso, a estratégia de remarketing/lookalike não tem base técnica confirmada.","severity":"high","source":"briefing"}],"opportunities":[{"title":"Zero concorrentes disputando lances nos termos de busca de categoria","description":"Nenhum concorrente identificado está disputando lances no Google Ads nos termos específicos de tecidos/moda em Vilhena no momento da análise, mesmo com ~410 buscas/mês combinadas de intenção de compra mensurável.","implication":"Qualquer investimento, por menor que seja, coloca o grupo na primeira posição com CPC mínimo — janela que se fecha assim que um concorrente decidir anunciar.","time_sensitivity":"urgent","source":"market_trend"},{"title":"Crescimento demográfico de Vilhena expande continuamente a base potencial","description":"Vilhena é polo regional de saúde, comércio e educação universitária, atraindo constantemente novos moradores sem vínculo com loja local, dentro de uma área de influência de ~180 mil habitantes em raio de 120 km.","implication":"Sustenta demanda de aquisição constante, independente de campanhas sazonais pontuais — vale manter presença de captação ativa ao longo do ano, não só em picos.","time_sensitivity":"medium_term","source":"briefing"},{"title":"WhatsApp consolidado como canal natural de vendas no varejo regional pós-pandemia","description":"Comportamento de mercado já identificado: cliente pesquisa no Instagram e manda mensagem no WhatsApp antes de buscar o produto na loja — modelo que o grupo já domina no atendimento físico.","implication":"Direcionar anúncios para WhatsApp é o caminho de menor fricção para o primeiro lead, sem depender de Pixel/LP maduros.","time_sensitivity":"medium_term","source":"briefing"},{"title":"Aviamentos é a única categoria com crescimento expressivo de busca (+57% YoY)","description":"Enquanto a maioria dos termos de categoria tem volume zero mensurável em Vilhena, 'aviamentos vilhena' cresceu 57% ano a ano — sinal de digitalização crescente do público B2B (costureiras, ateliês, tapeçarias).","implication":"Justifica uma frente de campanha e criativos dedicados ao segmento profissional, com CTA direto para WhatsApp e proposta de 'conta profissional'.","time_sensitivity":"urgent","source":"market_trend"},{"title":"Sazonalidade previsível permite planejamento antecipado de campanhas","description":"Calendário anual consolidado com picos em Maio (Dia das Mães), Novembro (Black Friday) e Dezembro (Natal/Enxoval), e alta relevância em Julho (Férias/Inverno) e Outubro (Formandos).","implication":"Permite reservar orçamento e produção de criativos com antecedência para os meses de maior retorno esperado, em vez de reagir de última hora.","time_sensitivity":"medium_term","source":"briefing"},{"title":"Captura de demanda por showrooming com canal digital de conversão direto","description":"Cliente que hoje experimenta o produto na loja física e finaliza a compra em marketplace (Shopee, Shein) poderia ser retido com um canal digital de conversão direto (WhatsApp/LP) somado ao crediário próprio.","implication":"A resposta estratégica não é reduzir preço — é reforçar o crediário e a entrega imediata sem risco de produto diferente do esperado, algo que o e-commerce nacional não replica.","time_sensitivity":"medium_term","source":"briefing"}],"threats":[{"title":"Havan como concorrente direto de porte nacional com maturidade digital muito superior","description":"Pixel Meta, GTM e GA4 ativos, +1.100 anúncios ativos no Meta Ads e ~4.000 anúncios ativos no Google Ads — impacta tanto o Rei do Pano (cama/mesa/banho, decoração, tecidos) quanto a Rainha Modas (moda, calçados).","implication":"Neutralizar não pela escala (impossível no curto prazo), mas pela especialização (tecidos)
