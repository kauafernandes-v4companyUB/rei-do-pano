    }
    if (p.persona_instructions) {
      h += '<div class="cd"><div class="cd__title">Instruções de Persona (system prompt)</div><div class="cd__body" style="font-size:.8125rem;line-height:1.55">'+E(p.persona_instructions)+'</div></div>';
    }
  }

  // CHECKLIST DE CONFIGURAÇÃO (status visual de cada item)
  if (d.configuration_checklist?.length) {
    const cats = {};
    d.configuration_checklist.forEach(item=>{
      if (!cats[item.category]) cats[item.category] = [];
      cats[item.category].push(item);
    });
    const statusIcon = {done:'✅', in_progress:'🔄', pending:'⏳', blocked:'❌'};
    const statusColor = {done:'green', in_progress:'blue', pending:'yellow', blocked:'red'};
    const statusLabel = {done:'Concluído', in_progress:'Em andamento', pending:'Pendente', blocked:'Bloqueado'};
    let checkHtml = '';
    Object.keys(cats).forEach(cat=>{
      checkHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem;color:var(--text)">'+E(cat)+'</h4>';
      checkHtml += '<div style="display:flex;flex-direction:column;gap:.375rem">';
      cats[cat].forEach(item=>{
        const st = item.status||'pending';
        const blockBadge = item.blocking ? tg('BLOQUEANTE','red') : '';
        checkHtml += '<div style="display:flex;align-items:flex-start;gap:.625rem;padding:.625rem;background:var(--surface,#f8fafc);border-radius:6px;border-left:3px solid var(--'+(statusColor[st]==='green'?'success':statusColor[st]==='red'?'danger':statusColor[st]==='yellow'?'warning':'primary')+',#94a3b8)">'
          + '<span style="font-size:1rem;flex-shrink:0">'+statusIcon[st]+'</span>'
          + '<div style="flex:1;min-width:0">'
          +   '<div style="font-size:.8125rem;line-height:1.4">'+E(item.item)+'</div>'
          +   '<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.125rem">Responsável: '+E(item.owner||'—')+' '+blockBadge+' '+tg(statusLabel[st],statusColor[st])+'</div>'
          + '</div>'
          + '</div>';
      });
      checkHtml += '</div>';
    });
    const totalItems = d.configuration_checklist.length;
    const doneCount = d.configuration_checklist.filter(i=>i.status==='done').length;
    const blockingPending = d.configuration_checklist.filter(i=>i.status==='pending' && i.blocking).length;
    let summary = '<div class="gr gr--3" style="margin-bottom:.75rem">'
      + mt(doneCount+'/'+totalItems, 'Concluídos', doneCount===totalItems?'green':'yellow')
      + mt(blockingPending, 'Bloqueantes pendentes', blockingPending===0?'green':'red')
      + mt(d.configuration_checklist.filter(i=>i.status==='pending'&&!i.blocking).length, 'Não-bloqueantes pendentes', 'gray')
      + '</div>';
    h += sc('Checklist de Configuração', summary+checkHtml);
  }

  // Perguntas configuradas
  if (d.patagon_config?.qualification_questions?.length) {
    h += sc('Perguntas Configuradas no Fluxo', d.patagon_config.qualification_questions.map(q=>
      cd('P'+(q.order||'?')+'. '+E(q.question), q.required?tg('Obrigatória','red'):tg('Opcional','gray'))
    ).join(''));
  }

  // Scoring rules
  if (d.patagon_config?.scoring_rules) {
    const sr = d.patagon_config.scoring_rules;
    const stars = [
      {key:'five_star', stars:'★★★★★', tone:'green'},
      {key:'four_star', stars:'★★★★', tone:'green'},
      {key:'three_star', stars:'★★★', tone:'yellow'},
      {key:'two_star', stars:'★★', tone:'gray'},
      {key:'one_star', stars:'★', tone:'red'},
    ];
    h += sc('Regras de Scoring Configuradas', stars.map(s=>{
      const r = sr[s.key]; if (!r) return '';
      return cd(s.stars+' — '+s.key.replace('_',' '),
        '<p style="font-size:.8125rem;margin:.25rem 0"><strong>Critérios:</strong> '+E(r.criteria||'—')+'</p>'
        +'<p style="font-size:.8125rem;margin:.25rem 0;color:var(--text-muted)"><strong>Ação automática:</strong> '+E(r.action||'—')+'</p>',
        s.tone);
    }).join(''));
  }

  // Integração Kommo
  if (d.kommo_integration) {
    const k = d.kommo_integration;
    let kHtml = '<div class="gr gr--3">'
      + mt(k.api_configured?'Conectado':'Pendente', 'API Kommo', k.api_configured?'green':'yellow')
      + mt(E(k.pipeline_name||'—'), 'Pipeline', '')
      + mt((k.field_mapping?.length||0)+' campos', 'Field Mapping', 'blue')
      + '</div>';
    if (k.stage_mapping) {
      const sm = k.stage_mapping;
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Mapeamento de Estágios</h4>';
      kHtml += tb(['Score','Estágio do Pipeline'],[
        ['4-5★ qualificado', E(sm.qualified_stage||'—')],
        ['3★ morno', E(sm.nurture_stage||'—')],
        ['1-2★ frio', E(sm.cold_stage||'—')],
      ]);
    }
    if (k.field_mapping?.length) {
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Custom Fields a Criar no Kommo ('+k.field_mapping.length+')</h4>';
      kHtml += tb(['Campo (lógico)','Nome no Kommo','Tipo','Custom?'],
        k.field_mapping.map(f=>[
          E(f.patagon_field),
          E(f.kommo_field),
          E(f.field_type),
          f.is_custom_field?tg('Custom','blue'):tg('Nativo','gray')
        ]));
    }
    if (k.auto_tags?.by_score) {
      kHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Tags Automáticas por Score</h4>';
      kHtml += tb(['Score','Tags'],
        Object.entries(k.auto_tags.by_score).map(([score,tags])=>[
          E(score),
          (tags||[]).map(t=>tg(t,'blue')).join(' ')
        ]));
    }
    h += sc('Integração Kommo', kHtml);
  }

  // Alertas
  if (d.alerts_config) {
    const a = d.alerts_config;
    let aHtml = '<div class="gr gr--3">'
      + mt(a.sla_minutes?a.sla_minutes+'min':'—', 'SLA Resposta', 'red')
      + mt(E(a.seller_name||'—'), 'Destinatário Principal', '')
      + (a.business_hours?mt(E((a.business_hours.start||'?')+' – '+(a.business_hours.end||'?')), 'Horário', ''):'')
      + '</div>';
    if (a.template) {
      aHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Template do Alerta</h4>';
      aHtml += '<pre style="background:var(--surface,#f8fafc);padding:.75rem;border-radius:6px;font-size:.75rem;line-height:1.5;white-space:pre-wrap;font-family:Menlo,Monaco,monospace">'+E(a.template)+'</pre>';
    }
    if (a.trigger_conditions?.length) {
      aHtml += '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Condições de Disparo</h4>';
      aHtml += '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+a.trigger_conditions.map(t=>'<li>'+E(t)+'</li>').join('')+'</ul>';
    }
    h += sc('Alertas pra Vendedor', aHtml);
  }

  // Resultados dos testes
  if (d.test_results?.length) {
    const sc2 = {pass:'green',fail:'danger',partial:'yellow'};
    const statusLabel2 = {pass:'Passou',partial:'Pendente',fail:'Falhou'};
    h += sc('Resultados dos Testes Simulados',
      tb(['#','Perfil','Score Esperado','Score Real','Kommo','Alerta','Tempo','Status','Observações'],
      d.test_results.map(t=>[
        E(t.lead_number),
        E(t.profile_description||''),
        E(t.expected_score||'—'),
        E(t.score||'—'),
        t.kommo_entry?tg('OK','green'):tg('—','gray'),
        t.alert_sent?tg('OK','green'):tg('—','gray'),
        E(t.response_time||'—'),
        tg(statusLabel2[t.status]||t.status, sc2[t.status]),
        E((t.issues||[]).join(' · '))
      ])));
  }

  // Plano de monitoramento pós go-live
  if (d.go_live?.monitoring_plan?.length) {
    let glHtml = '<div class="gr gr--2">'
      + mt(d.go_live.approved?'Aprovado':'Pendente', 'Aprovação Go-live', d.go_live.approved?'green':'yellow')
      + mt(d.go_live.activated_at||'—', 'Ativação', '')
      + '</div>'
      + '<h4 style="margin:1rem 0 .5rem;font-size:.875rem">Plano de Monitoramento Pós Go-live</h4>'
      + '<ul style="font-size:.8125rem;margin:.25rem 0;padding-left:1.25rem">'+d.go_live.monitoring_plan.map(p=>'<li>'+E(p)+'</li>').join('')+'</ul>';
    h += sc('Go-live e Monitoramento', glHtml);
  }

  // Problemas encontrados (pré-go-live)
  if (d.issues_found?.length) {
    h += sc('Pendências Bloqueantes Antes do Go-live',
      '<ul class="cl">'+d.issues_found.map(i=>'<li><span class="cl__icon cl__icon--blocked">&#10007;</span><span>'+E(i)+'</span></li>').join('')+'</ul>');
  }

  return h;
},

}; // end RENDERERS

// ===== ENGINE =====
function init() {
  const data = PORTAL_DATA;
  if (!data || !data.client) {
    const container = document.getElementById('presSlides');
    if (container) container.innerHTML = '<div class="pres-empty" style="height:100vh"><div class="pres-empty__icon">&#128203;</div><div class="pres-empty__text">Nenhum dado de portal encontrado. Execute render_portal.sh para gerar.</div></div>';
    return;
  }

  const client = data.client;
  const progress = data.progress || {};
  const outputs = data.outputs || {};
  const hasSales = client.modelo_venda ? true : (client.modulo_vendas !== false);
  const escopoVendas = Array.isArray(client.modulo_vendas_escopo) ? client.modulo_vendas_escopo : null;

  document.title = 'Portal V4 | ' + (client.name || 'Cliente') + ' | EE AI Powered';

  // Mapa id→nome amigável: reaproveita os nomes do WEEKS legado + nomes das skills do modelo de venda.
  const SKILL_NAMES = {};
  WEEKS.forEach(w => (w.skills||[]).forEach(s => { SKILL_NAMES[s.id] = s.name; }));
  Object.assign(SKILL_NAMES, {
    'ee-s1-arquitetura-presenca': 'Arquitetura de Presença Digital',
    'ee-s3-ecom-cro': 'Diagnóstico de CRO de E-commerce',
    'ee-s3-ecom-funil': 'Diagnóstico do Funil de E-commerce',
    'ee-s3-ecom-marketplace': 'Diagnóstico de Marketplace',
    'ee-s3-ecom-crm-regua': 'Régua de Relacionamento e CRM',
    'ee-s3-ecom-recuperacao-carrinho': 'Recuperação de Carrinho e Pós-Venda',
    'ee-s3-is-metricas-funil': 'Métricas e Critérios do Funil',
    'ee-s3-is-pipeline': 'Pipeline Comercial + Script Consultivo',
    'ee-s3-pdv-base-ativa': 'Diagnóstico da Base Ativa',
    'ee-s3-pdv-gmn': 'Diagnóstico de GMN',
    'ee-s3-pdv-experiencia': 'Experiência do PDV (Remoto)',
    'ee-s3-pdv-regua-whatsapp': 'Régua de WhatsApp para Loja',
  });

  // Estrutura de semanas: usa a injetada pelo render (model-aware via delivery-map) ou cai no WEEKS legado.
  let activeWeeks;
  if (Array.isArray(data.weeks) && data.weeks.length) {
    activeWeeks = data.weeks
      .map(w => ({ n:w.n, title:w.title, desc:w.desc||'', skills:(w.skills||[]).map(id => ({ id, name: SKILL_NAMES[id] || id })) }))
      .map(w => ({ ...w, skills: w.skills.filter(s => (progress.skills?.[s.id]?.status) !== 'skipped') }))
      .filter(w => w.skills.length > 0);
  } else {
    activeWeeks = WEEKS
      .map(w => (w.sales && escopoVendas) ? { ...w, skills: w.skills.filter(s => escopoVendas.includes(s.id)) } : w)
      .map(w => ({ ...w, skills: w.skills.filter(s => (progress.skills?.[s.id]?.status) !== 'skipped') }))
      .filter(w => (!w.sales || hasSales) && w.skills.length > 0);
  }

  requestAnimationFrame(() => {
    PRES.build(activeWeeks, progress, outputs);
    PRES.enter();
  });
}

function renderSkill(skill, progress, outputs) {
  const st = progress.skills?.[skill.id]?.status || 'pending';
  if (st === 'skipped') return '';
  const data = outputs[skill.id];

  const dots = { completed: 'done', in_progress: 'wip', pending: 'wait' };
  const badges = { completed: ['done','Concluído'], in_progress: ['wip','Em andamento'], pending: ['wait','Pendente'] };
  const [bc, bl] = badges[st] || badges.pending;

  let content = '';
  if (st === 'completed' && data && R[skill.id]) {
    try { content = '<div class="skill__body">' + R[skill.id](data) + '</div>'; }
    catch(e) { content = '<div class="skill__body"><p style="color:var(--danger)">Erro ao renderizar: ' + E(e.message) + '</p></div>'; }
  } else if (st === 'in_progress') {
    content = '<div class="skill__empty">Entrega em desenvolvimento...</div>';
  }

  return '<div class="skill skill--' + st + '">'
    + '<div class="skill__head">'
    +   '<span class="skill__dot skill__dot--' + (dots[st]||'wait') + '"></span>'
    +   '<span class="skill__name">' + E(skill.name) + '</span>'
    +   '<span class="skill__badge skill__badge--' + bc + '">' + E(bl) + '</span>'
    + '</div>'
    + content
    + '</div>';
}

function toggleWeek(n, forceOpen) {
  const body = document.getElementById('body-' + n);
  const chev = document.getElementById('chev-' + n);
  if (!body) return;

  if (body.style.maxHeight && !forceOpen) {
    body.style.maxHeight = null;
    if (chev) chev.classList.remove('week__chev--open');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    if (chev) chev.classList.add('week__chev--open');
  }
}

// ===== PRESENTATION MODE =====
const PRES = {
  slides: [], current: 0, active: false,

  build(weeks, progress, outputs) {
    const container = document.getElementById('presSlides');
    if (!container) return;
    container.innerHTML = '';
    this.slides = [];

    const badges = { completed: ['done','Concluído'], in_progress: ['wip','Em andamento'], pending: ['wait','Pendente'] };

    // ── Slide 0: Resumo Executivo (único slide scrollável) ──
    const allSkills = weeks.flatMap(w => w.skills)
      .filter(s => (progress.skills?.[s.id]?.status) !== 'skipped');
    const completedCount = allSkills.filter(s => (progress.skills?.[s.id]?.status) === 'completed').length;
    const totalCount = allSkills.length;
    const pctTotal = totalCount > 0 ? Math.round(completedCount / totalCount * 100) : 0;

    const summarySlide = document.createElement('div');
    summarySlide.className = 'pres-slide pres-slide--summary';

    const heroDiv = document.createElement('div');
    heroDiv.className = 'pres-summary-hero';
    heroDiv.innerHTML =
      '<div class="pres-summary-client">' + E(PORTAL_DATA.client?.name || 'Cliente') + '</div>'
      + '<p class="pres-summary-subtitle">Estruturação Estratégica com IA</p>'
      + '<div class="pres-summary-stat">'
      +   '<div class="pres-summary-stat-bar"><div class="pres-summary-stat-fill" style="width:' + pctTotal + '%"></div></div>'
      +   '<div class="pres-summary-stat-label">' + completedCount + ' de ' + totalCount + ' entregas &mdash; ' + pctTotal + '% concluído</div>'
      + '</div>'
      + '<button class="pres-summary-cta" onclick="PRES.next()">Ver Entregas &#8594;</button>';

    const weeksGrid = document.createElement('div');
    weeksGrid.className = 'pres-summary-weeks';

    weeks.forEach(week => {
      const done = week.skills.filter(s => (progress.skills?.[s.id]?.status) === 'completed').length;
      const wip  = week.skills.filter(s => (progress.skills?.[s.id]?.status) === 'in_progress').length;
      const pctW = week.skills.length > 0 ? Math.round(done / week.skills.length * 100) : 0;
      const isCurrent = progress.current_week === week.n;
      // Each week contributes 1 intro slide + N skill slides; slide 0 is the executive summary
      const weekFirstIdx = weeks.slice(0, weeks.indexOf(week)).reduce((acc, w) => acc + w.skills.length + 1, 0) + 1;

      const card = document.createElement('div');
      card.className = 'pres-summary-week-card' + (isCurrent ? ' pres-summary-week-card--current' : '');
      card.innerHTML =
        '<div class="pres-summary-week-tag">Semana ' + week.n + '</div>'
        + '<div class="pres-summary-week-title">' + E(week.title) + '</div>'
        + '<div class="pres-summary-week-bar"><div class="pres-summary-week-fill" style="width:' + pctW + '%"></div></div>'
        + '<div class="pres-summary-week-count">' + done + '/' + week.skills.length
        + (wip > 0 ? ' &nbsp;&middot;&nbsp; <span style="color:var(--warning)">' + wip + ' em andamento</span>' : '')
        + '</div>';
      card.onclick = () => PRES.go(weekFirstIdx);
      weeksGrid.appendChild(card);
    });

    // Cards de diagnósticos concluídos
    const diagItems = [];
    weeks.forEach(week => {
      week.skills.forEach(skill => {
        if ((progress.skills?.[skill.id]?.status) !== 'completed') return;
        const data = outputs[skill.id];
        if (!data) return;
        const summaryText = typeof data.summary === 'string' ? data.summary
          : typeof data.executive_summary === 'string' ? data.executive_summary : null;
        if (!summaryText) return;
        diagItems.push({ week, skill, data, summaryText });
      });
    });

    if (diagItems.length > 0) {
      const diagSection = document.createElement('div');
      diagSection.className = 'pres-summary-diag';
      diagSection.innerHTML = '<div class="pres-summary-diag-heading">Resumo dos Diagnósticos</div>';

      const clsMap = { critical:'red', low:'red', medium:'yellow', good:'green', excellent:'green' };

      diagItems.forEach(({ week, skill, data, summaryText }) => {
        const card = document.createElement('div');
        card.className = 'pres-summary-diag-card';

        // Metric block (score or benchmark)
        let metricHtml = '';
        if (data.overall_score != null) {
          const cls = clsMap[data.overall_classification] || 'gray';
          const label = { critical:'Crítico', low:'Baixo', medium:'Médio', good:'Bom', excellent:'Excelente' }[data.overall_classification] || '';
          metricHtml = '<div class="pres-summary-diag-metric">'
            + '<div class="pres-summary-diag-metric-val pres-summary-diag-metric-val--' + cls + '">' + data.overall_score + '</div>'
            + '<div class="pres-summary-diag-metric-lbl">' + (label || '/100') + '</div>'
            + '</div>';
        } else if (data.score != null) {
          metricHtml = '<div class="pres-summary-diag-metric">'
            + '<div class="pres-summary-diag-metric-val">' + data.score + '</div>'
            + '<div class="pres-summary-diag-metric-lbl">Score</div>'
            + '</div>';
        }

        card.innerHTML =
          '<div class="pres-summary-diag-tag">Semana ' + week.n + ' &mdash; ' + E(week.title) + '</div>'
          + '<div class="pres-summary-diag-name">' + E(skill.name) + '</div>'
          + '<div class="pres-summary-diag-text">' + E(summaryText) + '</div>'
          + metricHtml;

        diagSection.appendChild(card);
      });

      summarySlide.appendChild(heroDiv);
      summarySlide.appendChild(weeksGrid);
      summarySlide.appendChild(diagSection);
    } else {
      summarySlide.appendChild(heroDiv);
      summarySlide.appendChild(weeksGrid);
    }

    container.appendChild(summarySlide);
    this.slides.push({ el: summarySlide, n: 0, title: 'Resumo', skillName: 'Resumo Executivo', isSummary: true });

    // ── Slides 1..N: intro de cada semana + skills + conclusão ──
    weeks.forEach((week, wi) => {
      // Intro slide da semana: na semana 1 mostra só "A seguir"; nas demais, "Já concluímos" + "A seguir"
      const priorWeeks = weeks.slice(0, wi);
      const introEl = document.createElement('div');
      introEl.className = 'pres-slide pres-slide--transition';

      let introHtml = '<div class="pres-trans-inner">';

      if (priorWeeks.length > 0) {
        introHtml +=
          '<div>'
          + '<div class="pres-trans-label">Já concluímos</div>'
          + '<div class="pres-trans-heading">Entregas anteriores</div>'
          + '<ul class="pres-trans-list">'
          + priorWeeks.map(pw =>
              pw.skills.map(s => {
                const pst = (progress.skills?.[s.id]?.status) || 'pending';
                const pdone = pst === 'completed';
                return '<li class="pres-trans-item pres-trans-item--' + (pdone ? 'done' : 'pending') + '">'
                  + '<span class="pres-trans-icon pres-trans-icon--' + (pdone ? 'done' : 'pending') + '">' + (pdone ? '&#10003;' : '&#9675;') + '</span>'
                  + E(s.name)
                  + ' <span style="opacity:.6;font-size:.75rem;margin-left:.25rem">&middot; S' + pw.n + '</span>'
                  + '</li>';
              }).join('')
            ).join('')
          + '</ul>'
          + '</div>'
          + '<div class="pres-trans-divider"></div>';
      }

      introHtml +=
        '<div>'
        + '<div class="pres-trans-label">A seguir &middot; Semana ' + week.n + '</div>'
        + '<div class="pres-trans-heading">' + E(week.title) + '</div>'
        + '<ul class="pres-trans-list">'
        + week.skills.map(s =>
            '<li class="pres-trans-item">'
            + '<span class="pres-trans-icon pres-trans-icon--next">&#8594;</span>'
            + E(s.name) + '</li>'
          ).join('')
        + '</ul>'
        + '</div>'
        + '</div>';

      introEl.innerHTML = introHtml;
      container.appendChild(introEl);
      this.slides.push({ el: introEl, n: week.n, title: week.title, skillName: 'Abertura da Semana', isTransition: true });

      week.skills.forEach(skill => {
        const st = (progress.skills?.[skill.id]?.status) || 'pending';
        const data = outputs[skill.id];
        const [bc, bl] = badges[st] || badges.pending;

        const slide = document.createElement('div');
        slide.className = 'pres-slide';

        // Inner wrapper (flex column, fills slide)
        const inner = document.createElement('div');
        inner.className = 'pres-slide-inner';

        // Fixed header
        const header = document.createElement('div');
        header.className = 'pres-slide-header';
        const headerInner = document.createElement('div');
        headerInner.className = 'pres-slide-header-inner';
        headerInner.innerHTML =
          '<div class="pres-slide-breadcrumb">Semana ' + week.n + ' &mdash; ' + E(week.title) + '</div>'
          + '<div class="pres-skill-head">'
          +   '<span class="pres-skill-name">' + E(skill.name) + '</span>'
          +   '<span class="skill__badge skill__badge--' + bc + '">' + E(bl) + '</span>'
          + '</div>';
        header.appendChild(headerInner);

        // Scrollable content area (bounded to viewport)
        const contentWrap = document.createElement('div');
        contentWrap.className = 'pres-slide-content';
        const contentInner = document.createElement('div');
        contentInner.className = 'pres-slide-content-inner';

        if (st === 'completed' && data && R[skill.id]) {
          try { contentInner.innerHTML = R[skill.id](data); }
          catch(e) { contentInner.innerHTML = '<p style="color:var(--danger)">Erro ao renderizar: ' + E(e.message) + '</p>'; }
        } else if (st === 'in_progress') {
          contentInner.innerHTML = '<div class="pres-empty"><div class="pres-empty__icon">&#9203;</div><div class="pres-empty__text">Entrega em desenvolvimento...</div></div>';
        } else {
          contentInner.innerHTML = '<div class="pres-empty"><div class="pres-empty__icon">&#128203;</div><div class="pres-empty__text">Esta entrega ainda não foi iniciada.</div></div>';
        }

        contentWrap.appendChild(contentInner);
        inner.appendChild(header);
        inner.appendChild(contentWrap);
        slide.appendChild(inner);
        container.appendChild(slide);

        this.slides.push({ el: slide, n: week.n, title: week.title, skillName: skill.name });
      });

      // ── Slide final de conclusão (apenas na última semana) ──
      const isLast = wi === weeks.length - 1;
      if (isLast) {
        const finalEl = document.createElement('div');
        finalEl.className = 'pres-slide pres-slide--final';
        finalEl.innerHTML =
          '<div class="pres-final-inner">'
          + '<div class="pres-final-badge">Estruturação Estratégica com IA</div>'
          + '<div class="pres-final-congrats">Parabéns!</div>'
          + '<div class="pres-final-sub">Você encerrou a</div>'
          + '<div class="pres-final-title">Estruturação Estratégica</div>'
          + '<div class="pres-final-powered">AI Powered</div>'
          + '<div class="pres-final-vaas">Está pronto para atuar no modelo <strong>VAAS</strong></div>'
          + '</div>';
        container.appendChild(finalEl);
        this.slides.push({ el: finalEl, n: week.n, title: 'Fim', skillName: 'Conclusão', isFinal: true });
      }
    });

    this._updateUI();
  },

  enter() {
    if (!this.slides.length) return;
    this.active = true;
    this.current = 0;
    this.slides.forEach(s => s.el.classList.remove('pres-slide--active', 'pres-slide--prev'));
    this.slides[0].el.classList.add('pres-slide--active');
    this._updateUI();
  },

  exit() {
    this.go(0);
  },

  go(n) {
    const total = this.slides.length;
    if (n < 0 || n >= total || n === this.current) return;
    const forward = n > this.current;
    const oldEl = this.slides[this.current].el;
    const newEl = this.slides[n].el;

    oldEl.classList.remove('pres-slide--active');
    oldEl.classList.toggle('pres-slide--prev', forward);

    newEl.classList.remove('pres-slide--prev');
    newEl.classList.add('pres-slide--active');
    newEl.scrollTop = 0;

    this.current = n;
    this._updateUI();
  },

  next() { this.go(this.current + 1); },
  prev() { this.go(this.current - 1); },

  _updateUI() {
    const n = this.current, total = this.slides.length;
    const info = document.getElementById('presInfo');
    if (info) {
      const s = this.slides[n];
      info.textContent = s?.isSummary ? 'Resumo Executivo' : (n) + ' / ' + (total - 1);
    }
    const prevBtn = document.getElementById('presPrev');
    const nextBtn = document.getElementById('presNext');
    if (prevBtn) prevBtn.disabled = n === 0;
    if (nextBtn) nextBtn.disabled = n === total - 1;
    const dotsEl = document.getElementById('presDots');
    if (dotsEl) {
      const parts = [];
      // Dot 0: resumo executivo
      parts.push('<button class="pres-dot pres-dot--summary' + (n === 0 ? ' pres-dot--active' : '') + '" onclick="PRES.go(0)" title="Resumo Executivo"></button>');
      // Separator
      parts.push('<span style="width:8px;display:inline-block"></span>');
      // One dot per week
      const seen = new Set();
      const currentWeekN = this.slides[n]?.n;
      this.slides.forEach((s, i) => {
        if (s.isSummary || seen.has(s.n)) return;
        seen.add(s.n);
        const active = !this.slides[n]?.isSummary && s.n === currentWeekN;
        parts.push('<button class="pres-dot' + (active ? ' pres-dot--active' : '') + '" onclick="PRES.go(' + i + ')" title="Semana ' + s.n + '"></button>');
      });
      dotsEl.innerHTML = parts.join('');
    }
  }
};

document.addEventListener('keydown', function(e) {
  if (!PRES.active) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); PRES.next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); PRES.prev(); }
});


document.addEventListener('DOMContentLoaded', init);

// ============================================================================
// Password Gate handler
// ============================================================================
(function(){
  var HASH = 'd144ea9265eff61e5d02b5da46d694f5f922474366734e53db7b4698c7fc954c';
  var KEY  = 'v4-portal-auth';

  async function sha256(text) {
    var buf = new TextEncoder().encode(text);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  function unlock() {
    document.body.classList.remove('gate-locked');
    try { sessionStorage.setItem(KEY, HASH); } catch(e) {}
  }

  document.addEventListener('DOMContentLoaded', function(){
    var logo = document.getElementById('gateLogo');
    var fav = document.querySelector('link[rel="icon"]');
    if (logo && fav) logo.src = fav.href;

    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function(){
        try { sessionStorage.removeItem(KEY); } catch(e) {}
        location.reload();
      });
    }

    var form = document.getElementById('gateForm');
    if (!form) return;
    if (!document.body.classList.contains('gate-locked')) return;

    var input = document.getElementById('gateInput');
    var error = document.getElementById('gateError');
    var btn = form.querySelector('.gate__btn');
    var card = form.closest('.gate__card');

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      error.textContent = '';
      btn.disabled = true;
      try {
        var hash = await sha256(input.value);
        if (hash === HASH) {
          unlock();
        } else {
          error.textContent = 'Senha incorreta.';
          card.classList.remove('gate__card--shake');
          void card.offsetWidth;
          card.classList.add('gate__card--shake');
          input.value = '';
          input.focus();
        }
      } catch(err) {
        error.textContent = 'Erro ao validar. Tente novamente.';
      } finally {
        btn.disabled = false;
      }
    });
  });
})();
