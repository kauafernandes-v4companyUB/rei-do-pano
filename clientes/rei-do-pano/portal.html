> posicionamento -> diferencial -> CTA) nas bios sugeridas para Rei do Pano e Rainha Modas, cortando qualquer linha de horario/endereco."},{"pattern":"Hashtag propria recorrente como ativo de marca","seen_in_count":1,"seen_in_competitors":["Lojas Avenida"],"example_permalinks":[],"why_works":"#NovidadeNaAvenida funciona como um ativo de marca reconhecivel e recorrente, facilitando indexacao interna do Instagram e criando um padrao editorial identificavel.","how_to_apply":"Criar uma hashtag propria por marca (ex.: algo ligado a 'reinado'/coroa, territorio ja usado no posicionamento) e aplicar de forma consistente nos posts de novidade/chegada de produto."},{"pattern":"Reels em formato POV com etiqueta de preco fixa na tela","seen_in_count":1,"seen_in_competitors":["Lojas Avenida"],"why_works":"Resolve diretamente o problema 'sem texto/contexto na tela' hoje presente nos Reels do cliente (ex.: kit de bebe, ursos) — o espectador ve o preco e o produto ao mesmo tempo, sem precisar perguntar nos comentarios.","how_to_apply":"Adicionar texto na tela (preco, nome do produto, forma de pagamento) em todo Reels de produto, seguindo o mesmo principio POV ja usado organicamente pela equipe (alguem mostrando o produto)."},{"pattern":"Identidade visual de cor aplicada com disciplina em todos os pontos de contato (feed, destaques, artes, ate sacolas em video)","seen_in_count":1,"seen_in_competitors":["Lojas Avenida"],"why_works":"Torna a marca reconhecivel 'mesmo sem logo explicita' — o oposto do feed atual do Rei do Pano, descrito como sem padrao (arte grafica de entrega, foto de produto, video de influenciadora, cartaz de preco fotografado misturados).","how_to_apply":"Aplicar a paleta ja definida no Manual de Marca (vermelho/dourado Rei do Pano; dourado/cinza Rainha Modas) de forma consistente em capas de destaque, artes de post e ate nos elementos fisicos mostrados em video (embalagens, sacolas)."},{"pattern":"Prova visual do atributo fisico do produto nos primeiros segundos, antes da prova verbal","seen_in_count":1,"seen_in_competitors":["JLM Tecidos"],"why_works":"Demonstracao direta (ex.: sarja impermeavel em acao) convence pela evidencia sensorial do produto, algo especialmente relevante para tecidos, onde textura/caimento sao dificeis de comunicar so por texto.","how_to_apply":"Abrir os Reels de tecido do Rei do Pano mostrando o tecido em uso/contato (agua escorrendo, caimento no corpo, textura ao toque) nos 2-3 primeiros segundos, antes de qualquer fala."},{"pattern":"UGC estilo indicacao / prova social real de cliente usando o produto","seen_in_count":1,"seen_in_competitors":["Linda Casa"],"why_works":"Prova que o produto existe e e usado de verdade — o oposto direto do problema atual da Rainha Modas (fotos de banco de imagem de perfumes de terceiros que 'passam ar de golpe').","how_to_apply":"Substituir fotos de fabricante por fotos/videos reais de clientes ou da equipe usando o produto dentro da loja; usar os destaques de 'Avaliacoes' (ja recomendados no roadmap) como vitrine desse conteudo."}],"client_winning_patterns":[{"pattern":"Formato 'mostra + conta' (produto nas maos de alguem da loja, falando diretamente)","seen_in_count":-1,"recommendation":"Documento-fonte cita este formato explicitamente como o que ja funciona para o nicho nas duas marcas ('mostra + conta' para Rei do Pano; equivalente implicito nos formatos sugeridos de 'POV: montando um look' para Rainha Modas). Nao ha contagem exata de quantos posts usam o padrao (auditoria qualitativa), mas a recomendacao e amplificar: aumentar a proporcao de Reels nesse formato dentro da cadencia-alvo de 4-5 posts/semana."},{"pattern":"Alta frequencia real de captacao/gravacao de Reels","seen_in_count":-1,"recommendation":"O documento-fonte descreve isso como 'ponto forte real' — a equipe ja grava com regularidade e usa uma influenciadora local. A recomendacao explicita e nao pedir mais volume, e sim corrigir a execucao tecnica (os 6 problemas recorrentes) mantendo o ritmo de producao ja existente."},{"pattern":"Organizacao tematica dos destaques da Rainha Modas (Infantil, Novidade, Campanhas, Bolsas, Moda Feminina, Eletrodomesticos)","seen_in_count":-1,"recommendation":"Documento-fonte reconhece que isso 'mostra intencao de organizacao, que ja e melhor que a maioria dos perfis do nicho'. Recomendacao: manter a logica tematica, mas reduzir de 17 para no maximo 7 destaques com nomes completos e capas com identidade visual consistente."}],"instagram_compliance":{"aspect_ratio_issues_count":-1,"notes":"Nao foi possivel quantificar o numero exato de posts com problema de aspect ratio nesta auditoria manual (sem extracao de frames via Graph API/media_url). O documento-fonte identifica qualitativamente que Reels sao publicados na horizontal em vez do formato vertical nativo (9:16) como um problema RECORRENTE (um dos 6 problemas tecnicos listados, presente nas duas marcas), com a consequencia estimada de perda de ate 30% da tela e menor distribuicao pelo algoritmo — mas sem contagem de quantos posts especificos apresentam o problema."},"next_actions":[{"action":"Corrigir os 6 problemas tecnicos recorrentes dos Reels nas duas marcas: musica alinhada ao publico (nada de funk/eletronico pesado), remover marca d'agua do CapCut, eliminar cortes/transicoes abruptas, gravar e publicar em vertical (9:16), adicionar texto/contexto na tela e sempre escrever legenda","impact":"alto","effort":"medio","priority":1},{"action":"Fazer a limpeza de seguindo do Instagram do Rei do Pano (deixar de seguir contas aleatorias em lotes de 50, mantendo so fornecedores/parceiros/referencias do nicho) para restaurar autoridade de proporcao seguindo/seguidores","impact":"medio","effort":"baixo","priority":2},{"action":"Otimizar o perfil das duas marcas: trocar @ para formato limpo (ex. @reidopanooficial), foto de perfil (simbolo/coroa isolado para Rei do Pano; logo centralizada para Rainha Modas) e categoria (\"Compras e Varejo\" / \"Moda, Calcados e Acessorios\")","impact":"alto","effort":"baixo","priority":3},{"action":"Reescrever a bio das duas marcas com o framework autoridade -> posicionamento -> diferencial -> CTA ja sugerido no documento-fonte, removendo informacao pos-decisao (horario/endereco) e listas de categoria sem proposta de valor","impact":"alto","effort":"baixo","priority":4},{"action":"Reestruturar os destaques (Highlights): Rei do Pano seguindo a ordem Como Comprar -> Avaliacoes -> Novidades -> Dicas -> Vendedoras; Rainha Modas reduzindo de 17 para no maximo 7, com nomes completos","impact":"medio","effort":"medio","priority":5},{"action":"Substituir as fotos de banco de imagem de perfumes de marcas terceiras no feed da Rainha Modas por fotos/videos reais do produto dentro da loja, idealmente com UGC/prova social (padrao Linda Casa)","impact":"alto","effort":"medio","priority":6},{"action":"Adotar a linha editorial recomendada de 4-5 posts/semana por marca (2 Reels, 2 estaticos/carrosseis, 1 post leve de relacionamento/prova social), priorizando o formato 'mostra + conta' ja validado","impact":"medio","effort":"medio","priority":7},{"action":"Testar padroes do concorrente mais estudado (Lojas Avenida) e dos benchmarks de criativo (JLM Tecidos, Linda Casa): hashtag propria, Reels POV com preco fixo na tela e prova visual do atributo fisico do produto nos primeiros segundos","impact":"medio","effort":"medio","priority":8}],"completed_at":"2026-09-13T00:00:00-04:00"},"ee-s2-pesquisa-mercado":{"client_name":"Rei do Pano & Rainha Modas","summary":"A pesquisa de mercado formaliza o que já constava nos materiais originais do cliente: Rei do Pano é o único especialista em tecidos por metro do Cone Sul de Rondônia (~180 mil habitantes em raio de 120 km a partir de Vilhena), sem concorrência direta nesse nicho e com zero concorrentes anunciando nos termos de busca de categoria — enquanto Havan (direto, nacional) e Lojas Avenida (indireto, moda popular) disputam por preço/volume, não por especialização ou crediário próprio. TAM/SAM/SOM em R$ não puderam ser calculados: os materiais-fonte não trazem faturamento, ticket médio ou margem do cliente, lacuna já documentada no próprio material original (base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 5).","summary_headline":"Rei do Pano é o único especialista em tecidos do Cone Sul de RO (~180 mil hab., 0 concorrentes anunciando) — Havan e Avenida disputam preço, não especialização.","summary_highlights":[{"category":"posicao","label":"Especialista sem rival direto","value":"0 concorrentes diretos","subtext":"Nicho de tecidos por metro — saturação baixa em Vilhena/RO","tone":"green"},{"category":"competicao","label":"Concorrentes mapeados","value":"2 formais + 1 ameaça difusa","subtext":"Havan (direto) e Lojas Avenida (indireto), citados no pré-kick-off","tone":"yellow"},{"category":"janela","label":"Zero anunciantes na categoria","value":"0 concorrentes no Google Ads","subtext":"Termos de tecidos/casa em Vilhena sem disputa — CPC mínimo agora","tone":"blue"},{"category":"oportunidade","label":"Aviamentos B2B em alta","value":"+57% YoY","subtext":"Único termo de busca com crescimento expressivo (90 buscas/mês)","tone":"green"},{"category":"risco","label":"Gap de maturidade digital","value":"Havan: +1.100 Meta / ~4.000 Google Ads","subtext":"Pixel/GTM/GA4 ativos no concorrente — grupo ainda em nível V0","tone":"red"},{"category":"oportunidade","label":"Área de influência","value":"~180 mil habitantes","subtext":"Raio de 120 km a partir de Vilhena — polo regional em crescimento demográfico","tone":"blue"}],"summary_key_findings":[{"category":"vantagem","text":"Rei do Pano é referência regional há 30+ anos no nicho de tecidos por metro, sem concorrência direta em Vilhena/RO, com crediário próprio sem juros (até 6x) que nem a Havan (depende de cartão de terceiros) nem o e-commerce nacional replicam."},{"category":"contexto","text":"A demanda de categoria mensurável no Google ainda é pequena (~410 buscas/mês combinadas entre Rei do Pano e Rainha Modas, mai/2025-abr/2026) e concentrada em poucos termos — sinal de que a maior parte do público regional ainda compra por hábito, indicação ou memória de marca, não por busca digital."},{"category":"ameaca","text":"Havan opera com maturidade digital muito superior (Pixel Meta, GTM e GA4 ativos, +1.100 anúncios no Meta Ads e ~4.000 no Google Ads) e o avanço do e-commerce nacional (Shopee, Shein) captura vendas via showrooming — duas frentes competitivas às quais o grupo ainda não responde digitalmente (maturidade nível V0)."},{"category":"acao","text":"Nenhum concorrente identificado está disputando lances nos termos de busca de categoria (tecidos, cortinas, enxoval) em Vilhena — ocupar esse espaço agora garante CPC mínimo e primeira posição; o termo 'aviamentos vilhena' já cresce +57% YoY, sinalizando digitalização do público B2B (costureiras, ateliês, tapeçarias)."}],"segment":"Varejo (B2C) e atacado/profissional (B2B) de tecidos por metro, cama/mesa/banho, utilidades domésticas e eletrodomésticos (Rei do Pano) + moda feminina, calçados e acessórios (Rainha Modas)","region":"Vilhena/RO (sede, 3.000 m²) com filiais em Colorado do Oeste e Cerejeiras — área de influência de ~180 mil habitantes em raio de 120 km, cobrindo o Cone Sul de Rondônia e parte do Mato Grosso (municípios citados: Colorado do Oeste, Cerejeiras, Pimenta Bueno, Chupinguaia); Vilhena é polo regional de saúde, comércio e educação universitária","tam_sam_som":{"methodology":"top-down","tam":{"value_brl":0,"description":"TAM em R$ não pôde ser calculado a partir dos materiais originais do cliente. unavailable_reason: ausência de faturamento anual, ticket médio e dados setoriais em reais no briefing (client.json: briefing.identification.annual_revenue = null, briefing.product.ticket = null) — a Pesquisa de Mercado original também não calculou TAM/SAM/SOM (ver base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 5, 'Lacunas identificadas'). O único proxy geográfico/demográfico disponível nas fontes é a área de influência: ~180 mil habitantes em raio de 120 km a partir de Vilhena/RO (Cone Sul de Rondônia + parte do Mato Grosso), com Vilhena como polo regional de saúde, comércio e educação universitária em crescimento demográfico contínuo (fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 10; handoff-account-manager.md, seção 3). IMPORTANTE: o valor 0 abaixo é um marcador técnico de dado indisponível, não uma medição real de mercado nulo."},"sam":{"value_brl":0,"description":"SAM em R$ não pôde ser calculado pelo mesmo motivo do TAM (ausência de ticket médio/faturamento nas fontes). unavailable_reason: ver tam.description. O que as fontes efetivamente documentam sobre o mercado endereçável é qualitativo/comportamental, não monetário: saturação por nicho (tecidos: baixa, sem concorrência direta; moda popular: média, compete com Lojas Avenida) e um sinal de demanda digital mensurável de ~410 buscas/mês combinadas (Google Keyword Planner, Vilhena/RO, mai/2025-abr/2026), com 0 concorrentes ativos anunciando nesses termos específicos no Google Ads no momento da análise (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 1). O valor 0 abaixo é um marcador técnico de dado indisponível.","filters":["Geografia: raio de ~120 km a partir de Vilhena/RO (Cone Sul de Rondônia + parte do Mato Grosso), ~180 mil habitantes de área de influência","Nicho tecidos (Rei do Pano): saturação baixa, sem concorrência direta identificada em Vilhena","Nicho moda popular (Rainha Modas): saturação média, compete com Lojas Avenida e lojas locais","Sinal de demanda digital mensurável: ~410 buscas/mês combinadas (Google Keyword Planner, mai/2025-abr/2026), com 0 concorrentes ativos anunciando nesses termos no Google Ads"]},"som":{"value_brl":0,"description":"SOM em R$ não pôde ser calculado: não há triangulação possível pelos 3 métodos do framework (capacidade operacional, market share top-down, segmento) porque faltam os dados-base — faturamento anual, ticket médio, margem de contribuição atual e headcount de capacidade comercial estão todos em branco no formulário de pré-kick-off (fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 5, tabela de indicadores comerciais). unavailable_reason: ausência de dados financeiros-base no briefing original; a Pesquisa de Mercado original entregue ao cliente também não calculou SOM (ver base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 5). IMPORTANTE: o valor 0 abaixo é um marcador técnico de dado indisponível, não uma medição real, e NÃO deve ser confundido com a meta comercial da cliente (registrada separadamente em 'related_but_separate' abaixo, que é percentual, não um teto de mercado).","assumptions":["SOM em R$ não calculável por ausência de faturamento anual, ticket médio e margem de contribuição atual no briefing (client.json: product.ticket = null, identification.annual_revenue = null)","A meta comercial declarada pelo cliente é percentual (crescer 30% em 12 meses), não um valor absoluto — por isso foi registrada separadamente em 'related_but_separate' e não usada para derivar o SOM","Sinal indireto disponível para triangulação futura, ainda não convertido em R$: aviamentos B2B é o único termo de busca com crescimento expressivo (+57% YoY, 90 buscas/mês), indicando digitalização crescente da demanda do segmento profissional (costureiras autônomas, ateliês, tapeçarias, alfaiates, confecções pequenas, cortineiras)"],"related_but_separate":{"client_annual_revenue_goal_brl_v4mos":null,"client_annual_revenue_goal_source_v4mos":"unavailable_reason: não há valor de meta em R$ absolutos registrado no V4MOS nem no briefing — client.json/connectors não traz campo de meta de faturamento, apenas dados de mídia paga (0 campanhas no período consultado)","client_monthly_revenue_goal_kickoff":"Meta declarada: crescer as vendas do grupo em 'pelo menos 30%' nos próximos 12 meses — convergente entre o formulário de Pré-kick-off ('objetivo principal... com a V4 Company') e a Pesquisa de Mercado original ('aumentar as vendas do grupo em 30% nos próximos 12 meses'), fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 5","note":"A meta de 30% é percentual sobre uma base de faturamento não informada (annual_revenue = null no briefing) — portanto não é possível converter essa meta em R$ absolutos nem compará-la ao SOM. Trata-se de aspiração comercial declarada pelo cliente, distinta do SOM de mercado (que aqui também não pôde ser calculado por falta de dados-base). Margem líquida alvo declarada em paralelo: 8%-10%, com foco em elevar margem em decoração, cortinas sob medida e aviamentos (fonte: mesma seção)."}},"sources":[{"name":"Base de conhecimento interna — Mercado, SWOT e Concorrentes (dados de busca Google Keyword Planner, saturação por nicho, lacuna de TAM/SAM/SOM documentada)","url":"base-de-conhecimento/02-mercado-swot-concorrentes.md","year":2026},{"name":"Base de conhecimento interna — Empresa e Contexto (área de influência, indicadores comerciais em branco)","url":"base-de-conhecimento/00-empresa-e-contexto.md","year":2026},{"name":"Handoff Account Manager — Área geográfica, Portfólio e Concorrência","url":"handoff-account-manager.md","year":2026},{"name":"client.json — briefing (identification, product, digital_situation)","url":"client.json","year":2026}]},"competitors":[{"name":"Havan","positioning":"Megastore nacional de moda, casa, eletro, ferramentas e mais; imagem do dono (Luciano Hang) fortemente associada à marca; loja física como destino de passeio (grande diferencial de espaço); mix amplo sem profundidade — 'presente em tudo, especialista em nada'.","channels":["Google Ads (Search, Display, Shopping, Vídeo e Local)","Meta Ads","Site institucional e aplicativo próprio como canal de conversão direto","Estratégia de influenciador (Camylla Miranda) para conteúdo gerado por consumidor e alcance orgânico"],"strengths":["Maturidade digital alta: Pixel Meta ativo (1 evento), Google Tag Manager ativo (GTM-MSRC), GA4 ativo (G-SDEH2SZNKR) e Google Ads ativo (AW-985015144)","+1.100 anúncios ativos no Meta Ads e ~4.000 anúncios ativos no Google Ads","Experiência de loja física como destino de passeio (grande diferencial de espaço)","Marca nacional forte, associada à figura pública do dono"],"weaknesses":["Marca nacional sem vínculo com Vilhena (zero conexão regional)","Sem crediário próprio — depende 100% de cartão de crédito de terceiros","Não é especialista em tecidos — segmento inteiro em aberto para o Rei do Pano"],"estimated_pricing":"unavailable_reason: os materiais do cliente concentraram a análise da Havan em volume de mídia e rastreamento digital (Pixel/GTM/GA4/Ads), sem levantar ticket médio ou tabela de preços","digital_score":9,"digital_details":{"website":"Site institucional e aplicativo próprio usados como canal de conversão direto nos anúncios do Meta","instagram":"Categoria de perfil 'Compras e Varejo' (a mesma recomendada para o Rei do Pano); proporção seguindo/seguidores muito favorável","google":"Google Tag Manager (GTM-MSRC) e GA4 (G-SDEH2SZNKR) ativos; Google Ads ativo (AW-985015144)","active_ads":"+1.100 anúncios ativos no Meta Ads; ~4.000 anúncios ativos no Google Ads (Search, Display, Shopping, Vídeo e Local)"}},{"name":"Lojas Avenida","positioning":"Moda popular e varejo com foco em produto + preço + sazonalidade; comunicação 100% promocional ('tempo limitado', 'a partir de R$49'); Cartão Avenida como âncora de fidelização e parcelamento.","channels":["Meta Ads","Google Ads","Instagram orgânico com identidade visual disciplinada"],"strengths":["Bio eficiente no Instagram: 'loja mais alegre do Brasil' + 'aqui tem promoção, produto e muito humor' — comunica o que é e por que seguir em segundos","Identidade visual amarelo + preto aplicada com disciplina em feed, destaques, artes e até nas sacolas mostradas em vídeos","Hashtag própria (#NovidadeNaAvenida) funcionando como ativo de marca recorrente","Proporção seguindo/seguidores muito favorável (referência citada nos materiais: 26 seguindo para 1,5-1,7 milhão de seguidores em contas benchmark do gênero)","Reels em formato POV (ex.: 'montando looks com as bermudas que encontrei na Avenida') com etiquetas de preço fixas na tela"],"weaknesses":["Pixel Meta não instalado","Sem especialidade em tecidos","Sem crediário próprio","Feed descrito nos materiais como 'panfleto digital', sem identidade nem storytelling","CTA genérico nos criativos ('vem conferir na Avenida mais próxima') sem especificar próximo passo para quem não tem loja perto"],"estimated_pricing":"A partir de R$49 (padrão recorrente de comunicação promocional identificado nos criativos analisados)","digital_score":6,"digital_details":{"website":"unavailable_reason: os materiais do cliente não auditaram o site institucional da Lojas Avenida, apenas Instagram e ferramentas de rastreamento","instagram":"Bio eficiente, identidade visual amarelo+preto disciplinada, hashtag própria #NovidadeNaAvenida, posts fixados ancorando promoções vigentes no topo do perfil","google":"Google Tag Manager com 2 containers; GA4 com 2 propriedades; Google Ads com conversões ativas; Pixel Meta não instalado","active_ads":"+110 anúncios ativos no Meta; ~200 anúncios ativos no Google Ads"}},{"name":"Lojas Torra (benchmark de criativos — não classificado formalmente como concorrente direto/indireto nos materiais originais)","positioning":"Rede de moda íntima/vestuário usada nos materiais do cliente apenas como referência de boas práticas de criativo sazonal (Dia das Mães), não como concorrente mapeado geograficamente.","channels":["unavailable_reason: materiais do cliente analisaram apenas 1 criativo específico (campanha de Dia das Mães), sem auditoria de canais de aquisição"],"strengths":["Criativo de Dia das Mães analisado em detalhe: oferta 'Leve 3 pague 2' (multiplica valor percebido sem desconto direto em R$)","Paleta terracota consistente e exclusiva da campanha sazonal, casting mãe e filha, CTA emocional ('Gostou? Presente de Dia das Mães é na Torra')","Parcelamento '10x fixas, última parcela grátis' como argumento de conversão"],"weaknesses":["unavailable_reason: materiais do cliente não auditaram fraquezas da Torra — ela foi usada exclusivamente como benchmark positivo de criativo, não como concorrente avaliado"],"estimated_pricing":"unavailable_reason: materiais do cliente não levantaram ticket médio da Torra, apenas a mecânica promocional do criativo analisado ('Leve 3 pague 2', parcelamento 10x)","digital_score":5,"digital_details":{"website":"unavailable_reason: não auditado — Torra não é tratada como concorrente formal nos materiais, apenas como referência de criativo","instagram":"unavailable_reason: não auditado como perfil completo — apenas 1 criativo específico foi analisado","google":"unavailable_reason: não auditado","active_ads":"unavailable_reason: não auditado — apenas o criativo de Dia das Mães foi analisado em detalhe. NOTA DE TRANSPARÊNCIA: o campo digital_score acima (5) é um valor neutro de preenchimento obrigatório do schema, não uma avaliação real de maturidade digital — os materiais originais não classificam a Torra como concorrente nem auditam sua presença digital. Ver honesty_alert."}}],"competitive_map":{"axis_x":"Generalista (mix amplo) → Especialista (tecidos/casa)","axis_y":"Preço/conveniência genérica → Confiança regional + crediário próprio","positions":[{"name":"Havan","quadrant":"Generalista / preço-conveniência (mix amplo, sem crediário próprio, sem vínculo regional)"},{"name":"Lojas Avenida","quadrant":"Generalista (moda popular) / preço-conveniência (comunicação 100% promocional, sem crediário próprio)"},{"name":"Rei do Pano (posição atual)","quadrant":"Especialista (tecidos) / confiança regional alta mas ainda pouco comunicada digitalmente (maturidade V0)"},{"name":"Rei do Pano (posição recomendada)","quadrant":"Especialista / confiança regional + crediário ativamente comunicados — quadrante hoje vazio"}],"empty_spaces":"Especialista em tecidos + crediário próprio + atendimento humanizado regional comunicados digitalmente de forma consistente — nenhum concorrente mapeado ocupa esse espaço; o Rei do Pano já tem os ativos (30+ anos, crediário sem juros, nota 4,6/5,0 no Google), mas ainda não os comunica de forma estruturada no digital.","crowded_spaces":"Preço/promoção genérica sem especialização — Havan (mix amplo) e Lojas Avenida (moda popular promocional) disputam esse espaço, ambas sem crediário próprio e sem vínculo declarado com a comunidade de Vilhena."},"trends":[{"trend":"Aviamentos B2B é a única categoria com crescimento expressivo de busca digital","evidence":"+57% YoY no termo 'aviamentos vilhena' (90 buscas/mês, concorrência baixa) — Google Keyword Planner, Vilhena/RO, mai/2025-abr/2026 (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md)"},{"trend":"Crescimento demográfico contínuo de Vilhena como polo regional","evidence":"Vilhena descrita como polo de saúde, comércio e educação universitária, atraindo constantemente novos moradores 'sem vínculo com loja local' — área de influência de ~180 mil habitantes em raio de 120 km (fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 10)"},{"trend":"WhatsApp consolidado como canal natural de vendas no varejo regional pós-pandemia","evidence":"Comportamento identificado nos materiais: cliente pesquisa no Instagram → manda mensagem no WhatsApp → busca o produto na loja — modelo que o grupo já domina no atendimento físico (fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 10; 02-mercado-swot-concorrentes.md, seção 2)"},{"trend":"Comportamento de showrooming em ascensão (pesquisa física, compra online)","evidence":"Cliente experimenta o produto na loja física e finaliza a compra em marketplaces nacionais (Shopee, Shein) — citado como 'ameaça difusa' em múltiplas fontes (base-de-conhecimento/00-empresa-e-contexto.md, seção 10; 02-mercado-swot-concorrentes.md, seção 2)"}],"threats":[{"threat":"Avanço do e-commerce nacional (Shopee, Shein e afins) via showrooming","potential_impact":"Concorrência sem CNPJ ou endereço físico identificável, competindo por preço e conveniência — cliente experimenta o produto na loja física do grupo e finaliza a compra online, sem que o grupo capture a venda (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 2)"},{"threat":"Havan como concorrente direto de porte nacional com maturidade digital muito superior","potential_impact":"Pixel Meta, GTM e GA4 ativos, +1.100 anúncios no Meta Ads e ~4.000 no Google Ads — enquanto o grupo ainda está em maturidade digital nível V0 (sem Pixel, GTM, GA4 ou histórico de campanhas pagas), risco de perda de share of voice digital nos próximos 12 meses (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 3.1; 00-empresa-e-contexto.md)"},{"threat":"Dependência do modelo tradicional de loja física ('passeio')","potential_impact":"Modelo vem perdendo espaço para o modelo de autoatendimento de grandes redes (ex. Havan) — pressão estrutural sobre o fator 'passeio/comodidade' que hoje sustenta parte do tráfego físico do grupo (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 2; 00-empresa-e-contexto.md, seção 7)"}],"unexploited_opportunity":{"description":"Ocupar o território 'o único especialista em tecidos por metro do Cone Sul de Rondônia' — o nicho de tecidos tem saturação baixa em Vilhena e zero concorrentes identificados disputando lances nos termos de busca de categoria no Google Ads no momento da análise.","why_nobody_does_it":"(1) A Havan tem mix amplo (moda, casa, eletro, ferramentas) mas não é especialista em tecidos — reposicionar-se como especialista exigiria abandonar sua proposta de megastore nacional. (2) A Lojas Avenida atua em moda popular e preço, sem operação nem estoque de tecidos por metro — está fora do seu modelo de negócio. (3) Nenhum concorrente identificado está disputando lances nos termos de busca de categoria (tecidos, cortinas sob medida, enxoval) em Vilhena — a demanda ainda não foi digitalizada; ocupar esse espaço agora garante CPC mínimo e primeira posição.","feasibility":"alta"},"market_jtbd":{"current_solutions":"A maioria dos moradores da região ainda resolve a necessidade de tecidos/casa e moda indo fisicamente à loja, por hábito, indicação ou memória de marca — a maior parte dos termos de busca de categoria aparece com volume zero em Vilhena, o que os materiais interpretam como 'demanda ainda não digitalizada', não inexistente (fonte: base-de-conhecimento/02-mercado-swot-concorrentes.md, seção 1).","alternatives":[{"type":"direct","description":"Concorrentes regionais com modelo de loja física: Havan (direto, mix amplo) e Lojas Avenida (indireto, moda popular)"},{"type":"indirect","description":"E-commerce nacional (Shopee, Shein e afins) via showrooming — cliente experimenta o produto na loja física e finaliza a compra online"}],"cost_of_inaction":"Continuar dependendo do modelo tradicional de loja física ('passeio'), perdendo espaço para o modelo de autoatendimento das grandes redes, e permanecer exposto ao showrooming do e-commerce nacional sem uma contrapartida digital que capture essa venda (fonte: base-de-conhecimento/00-empresa-e-contexto.md, seção 7 e 10)."},"real_differentials":[{"differential":"Crediário próprio, familiar e sem juros, parcelado em até 6x","status":"confirmed","icp_relevance":"Resolve a objeção mais recorrente do ICP (dúvida sobre como funciona o crediário/compra pelo WhatsApp) e atende diretamente o perfil que não quer comprometer o limite do cartão de crédito — inadimplência de apenas 1,5%-2,5% comprova a solidez do modelo","action_needed":"Comunicar ativamente esse diferencial nos canais digitais — hoje avaliado como pouco explorado fora do atendimento presencial"},{"differential":"Nota 4,6/5,0 no Google Meu Negócio com mais de 327 avaliações","status":"confirmed","icp_relevance":"Prova social forte que reduz a desconfiança do ICP em comprar por canal digital sem garantia de entrega/pós-venda","action_needed":"Explorar essas avaliações ativamente em conteúdo, destaques do Instagram e criativos de anúncio — hoje pouco explorada digitalmente"},{"differential":"Especialidade em tecidos por metro sem concorrência direta em Vilhena","status":"confirmed","icp_relevance":"Atende diretamente o job funcional de 'encontrar variedade completa em um só lugar' sem alternativa local equivalente","action_needed":"Reforçar o posicionamento de especialista nos criativos e na estruturação de busca paga, já que nenhum concorrente disputa esses termos hoje"},{"differential":"Base histórica de clientes cadastrados no sistema Linx","status":"potential","icp_relevance":"Ativo de baixo custo para reativação/retenção de clientes que já compraram antes (nível 4 de consciência)","action_needed":"Confirmar formalmente se o Linx é de fato o sistema em uso, se cobre as 3 lojas + Rainha Modas, e se a exportação de dados de clientes é operacionalmente viável (formato, LGPD, frequência) — divergência já identificada entre o pré-kick-off e documentos posteriores"},{"differential":"Crescimento de +57% YoY em busca por aviamentos (segmento B2B)","status":"potential","icp_relevance":"Sinaliza digitalização crescente do público profissional (costureiras autônomas, ateliês, tapeçarias, alfaiates, confecções pequenas, cortineiras), que já compra em volume e com fidelidade alta quando há estoque e crédito","action_needed":"Criativos e campanha dedicados ao público B2B, com segmentação por interesse profissional e CTA direto para WhatsApp com proposta de 'conta profissional'"}],"honesty_alert":"Duas limitações relevantes desta pesquisa, herdadas dos materiais originais do cliente: (1) TAM/SAM/SOM em R$ não puderam ser calculados — o briefing não traz faturamento anual, ticket médio nem margem de contribuição atual (todos em branco no pré-kick-off), e a Pesquisa de Mercado original entregue ao cliente também não calculou esses valores, apenas a área de influência demográfica (~180 mil habitantes) e o volume de busca digital (~410 buscas/mês); os valores 0 registrados em tam_sam_som são marcadores técnicos de dado indisponível, não medições reais de mercado. (2) A lista de concorrentes formalmente mapeados nos materiais originais tem apenas 2 nomes (Havan e Lojas Avenida, citados pelo próprio cliente no pré-kick-off) — o terceiro competidor incluído aqui para atender ao formato mínimo do output (Lojas Torra) é tratado nos materiais originais apenas como benchmark de criativo, não como concorrente mapeado geograficamente; seu digital_score é um valor neutro de preenchimento, não uma avaliação real. Recomenda-se validar com o cliente se algum dos demais benchmarks de criativo citados (Linda Casa, JLM Tecidos, Mundo do Enxoval, comercialtextilstore) de fato compete pelo mesmo cliente em Vilhena.","completed_at":"2026-09-13T00:00:00Z"},"ee-s2-posicionamento":{"client_name":"Rei do Pano & Rainha Modas","summary":"Posicionamento do Rei do Pano & Rainha Modas formalizado em torno do conceito já aprovado em kick-off 'O Novo Reinado' — duas coroas em tronos digitais separados, ancoradas no crediário próprio sem juros em até 6x (inadimplência de apenas 1,5%-2,5%) como diferencial real e não replicável pelos concorrentes mapeados (Havan, Lojas Avenida). Território de grupo: Reinado · Legado · Facilidade, com DNA e arquétipos distintos já validados por marca (Rei do Pano: Governante+Companheiro; Rainha Modas: Amante+Governante).","summary_headline":"Rei do Pano & Rainha Modas ocupam 'O Novo Reinado' — crediário próprio sem juros até 6x como diferencial único, janela aberta mas maturidade digital ainda V0.","summary_highlights":[{"category":"posicao","label":"Território de marca","value":"O Novo Reinado — Reinado · Legado · Facilidade","subtext":"Duas coroas, dois tronos digitais separados (Rei do Pano + Rainha Modas), conceito aprovado em kick-off","tone":"blue"},{"category":"competicao","label":"Território do concorrente #1","value":"Havan: Mix amplo + Loja-passeio nacional","subtext":"Sem crediário próprio e sem vínculo regional — \"presente em tudo, especialista em nada\"","tone":"yellow"},{"category":"janela","label":"Concorrentes anunciando os termos de categoria","value":"0 concorrentes","subtext":"~410 buscas/mês combinadas (Google Keyword Planner, 100% intenção de compra) sem nenhum concorrente disputando lances nesses termos","tone":"green"},{"category":"oportunidade","label":"ICP + estágio de consciência","value":"Dona Aparecida (35-60a) e Camila (28-55a) — nível 3/5","subtext":"Já sabem que precisam comprar, só não decidiram onde; o crediário sem juros até 6x é o argumento que fecha essa decisão","tone":"green"},{"category":"risco","label":"Separação dos perfis de Instagram","value":"Tratada como decidida, mas não validada com o cliente","subtext":"O Manual de Marca assume \"dois tronos\" separados como resolvido, mas essa decisão nunca foi formalmente confirmada em reunião com o cliente","tone":"yellow"},{"category":"maturidade","label":"Maturidade digital","value":"V0 (Estruturação)","subtext":"Sem Pixel Meta, GTM, GA4 ou histórico de campanhas pagas em nenhuma das duas marcas — posicionamento aprovado, execução digital ainda não iniciada","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O crediário próprio sem juros em até 6x é o diferencial real e não replicável digitalmente por concorrentes nacionais ou e-commerce — a inadimplência de apenas 1,5%-2,5% comprova a solidez da relação de confiança com a base de clientes."},{"category":"contexto","text":"O conceito 'O Novo Reinado' já foi aprovado pelo cliente em kick-off (30/04/2026) e materializado no Manual de Marca (31 páginas) e na Landing Page publicada ('Construindo um Novo Reinado') — este output formaliza uma direção já validada, não propõe uma nova."},{"category":"ameaca","text":"A Havan já opera com maturidade digital alta (Pixel/GTM/GA4 ativos, +1.100 anúncios Meta, ~4.000 Google Ads) e pode consolidar presença digital regional antes de o grupo migrar de 'Instagram como panfleto de preço' para a execução consistente do posicionamento já aprovado."},{"category":"acao","text":"Confirmar formalmente com o cliente a separação dos dois perfis de Instagram (Rei do Pano unificado nas 3 lojas x Rainha Modas com voz própria) — hoje tratada como decidida apenas dentro do Manual de Marca, sem validação explícita em reunião com o cliente."}],"positioning_map":{"axis_x":"Mix amplo generalista ←→ Especialista regional","axis_y":"Autoatendimento/transacional ←→ Humanizado + crediário próprio","client_position":"Especialista regional + Humanizado com crediário próprio (quadrante superior direito)","justification":"Dos dois concorrentes citados pelo próprio cliente no pré-kick-off (Havan e Lojas Avenida), nenhum combina especialidade regional com crediário próprio sem juros: Havan tem escala nacional e mix amplo, mas é generalista ('presente em tudo, especialista em nada') e sem crediário; Lojas Avenida tem cartão próprio (Cartão Avenida), mas comunicação 100% promocional/genérica e sem especialidade em tecidos. O grupo já ocupa esse cruzamento na prática há 30+ anos — falta apenas comunicá-lo digitalmente.","competitor_positions":[{"name":"Havan","quadrant":"Mix amplo generalista + Autoatendimento (loja-passeio nacional, sem crediário próprio, sem vínculo regional)"},{"name":"Lojas Avenida","quadrant":"Moda popular + Promocional (Cartão Avenida como âncora, comunicação 100% preço/urgência, sem especialidade em tecidos)"}]},"positioning_statements":[{"label":"O Novo Reinado (direção aprovada em kick-off)","statement":"Para famílias e profissionais do Cone Sul de Rondônia que precisam renovar a casa ou o guarda-roupa sem estourar o orçamento, o Rei do Pano e a Rainha Modas são o reinado regional de tecidos, casa e moda que facilita a conquista com crediário próprio sem juros em até 6x, porque atendem a região há mais de 30 anos com o mesmo compromisso de sempre — agora em dois tronos digitais dedicados.","justification":"É a direção já aprovada pelo cliente em kick-off e materializada no Manifesto e no Manual de Marca ('Agora, o Rei do Pano e a Rainha Modas ocupam tronos separados na internet... unidas pelo mesmo compromisso de sempre'). Unifica a narrativa de grupo mantendo a especialização de cada marca, ancorada no único diferencial não replicável pelos concorrentes mapeados: o crediário próprio.","bet":"Prioriza consolidar uma narrativa de grupo unificada por trás de duas identidades digitais especializadas, ancoradas no crediário próprio e na tradição regional.","risk":"Exige sustentar execução consistente em duas frentes simultâneas (Rei do Pano e Rainha Modas) — inclusive a decisão de separar os perfis de Instagram, formalizada no Manual de Marca mas nunca confirmada explicitamente com o cliente (ver honesty_alert)."},{"label":"O Especialista Regional em Tecidos (direção mais estreita, não escolhida)","statement":"Para donas de casa e profissionais da costura em Vilhena e região que não encontram variedade de tecidos com atendimento humanizado, o Rei do Pano é a maior loja especializada em tecidos por metro do Cone Sul de Rondônia, porque nenhum concorrente mapeado disputa esse nicho e o crediário próprio sem juros facilita a compra.","justification":"Apoiada em dado de mercado real (saturação baixa em tecidos, 0 concorrentes anunciando os termos de categoria pesquisados, crescimento de +57% YoY em aviamentos) — mas restrita ao Rei do Pano, deixando a Rainha Modas fora da narrativa. Não foi a direção escolhida pelo cliente, que já aprovou o conceito de grupo 'O Novo Reinado'.","bet":"Prioriza aprofundar a autoridade de nicho (tecidos) sobre a amplitude e a força de grupo.","risk":"Abandona a narrativa de grupo já validada e deixa a Rainha Modas sem território de marca comunicado — reduz o projeto a uma única das duas marcas do cliente."},{"label":"O Concorrente por Preço/Passeio (direção explicitamente descartada)","statement":"Para o consumidor que compara preço e experiência de loja física, o grupo seria apenas mais uma opção de varejo popular no Cone Sul de Rondônia, competindo por promoção e menor preço, como Havan e Lojas Avenida.","justification":"Representa o posicionamento 'atual' que a própria Pesquisa de Mercado descreve como perdendo espaço no fator 'passeio/comodidade' para a Havan, e que o material recomenda explicitamente evitar: 'o antídoto estratégico não é reduzir preço'.","bet":"Nenhuma aposta estratégica real — é o caminho de menor diferenciação, incluído aqui apenas como contraste ao que foi decidido.","risk":"Altíssimo: o grupo não tem 'loja-passeio' de porte nacional para justificar essa disputa, abre mão do único diferencial não replicável (crediário) e entra numa guerra de preço contra concorrentes de maior escala e contra o showrooming do e-commerce nacional."}],"chosen_statement":"Para famílias e profissionais do Cone Sul de Rondônia que precisam renovar a casa ou o guarda-roupa sem estourar o orçamento, o Rei do Pano e a Rainha Modas são o reinado regional de tecidos, casa e moda que facilita a conquista com crediário próprio sem juros em até 6x, porque atendem a região há mais de 30 anos com o mesmo compromisso de sempre — agora em dois tronos digitais dedicados.","puv":"O único reinado regional de tecidos, casa e moda do Cone Sul de Rondônia que facilita a conquista da família com crediário próprio sem juros em até 6x — sem depender do limite do cartão e sem abrir mão do atendimento humano de mais de 30 anos — agora em dois tronos digitais dedicados: Rei do Pano e Rainha Modas.","canvas_4p":{"product":{"delivers":"Duas linhas de produto complementares sob uma mesma narrativa de grupo: no Rei do Pano, tecidos por metro (categoria-âncora sem concorrência direta), cama/mesa/banho, eletrodomésticos e utilidade doméstica, e decoração/cortinas sob medida; na Rainha Modas, moda feminina (foco 28-55 anos), calçados e acessórios. Em ambas as marcas, o crediário próprio sem juros em até 6x e o atendimento humanizado de mais de 30 anos.","transformation":"Antes: cliente com orçamento apertado, sem crédito disponível no cartão, que vê reformar a casa ou vestir a família como um peso ou burocracia, e às vezes compra online de fora sem confiar na entrega/pós-venda. Depois: parcela em até 6x sem juros no crediário próprio, encontra a variedade completa (do menor aviamento ao enxoval, do infantil ao adulto) em um só lugar, e é atendida por quem a conhece pelo nome — a compra vira, nas palavras do próprio Manifesto, 'a realização de um sonho facilitado', não um peso.","doesnt_deliver":"Não é a opção mais barata para quem compara apenas preço de prateleira sem considerar o crediário (Havan e e-commerce nacional como Shopee/Shein competem em preço puro e conveniência online); ainda não tem e-commerce transacional completo — a Landing Page atual gera lead/direciona ao WhatsApp, não é loja virtual com carrinho e checkout; e a Rainha Modas ainda não tem um discurso de moda tão robusto e distinto quanto o Rei do Pano tem em tecidos (o slide de 'Pilares e Valores' da Rainha Modas no Manual de Marca reaproveita, aparentemente por erro de produção, o texto do Rei do Pano — ver honesty_alert)."},"price":{"positioning":"mid-market","justification":"Estratégia de preço segmentada por categoria, não um único posicionamento: premium de nicho em tecidos exclusivos (patchwork, tricoline estampada, Paninho Mágico), onde o Rei do Pano é referência única sem pressão competitiva; preço igual ou levemente abaixo da Havan em categorias de volume (cama, mesa, banho, eletrodomésticos), já que o grupo não tem 'loja-passeio' para justificar prêmio nessas linhas; na Rainha Modas, precificação baseada em giro e tendência. O crediário próprio sem juros é o argumento central de valor na comunicação, não o preço listado — é ele que neutraliza a vantagem de parcelamento dos marketplaces e do e-commerce nacional.","anchoring":"Ancorar a comunicação no custo-benefício do crediário próprio (parcela sem juros, sem burocracia, sem depender do limite do cartão) em vez de comparar preço unitário — especialmente contra o showrooming de e-commerce nacional, que não replica crediário local nem atendimento presencial."},"place":{"main_channel":"WhatsApp","main_channel_justification":"É o canal que o ICP já usa e confia no comportamento pós-pandemia (pesquisa no Instagram → mensagem no WhatsApp → busca o produto na loja), e é onde o crediário próprio pode ser explicado e fechado sem burocracia — ainda que, no momento do briefing, esse atendimento estivesse 'em estruturação', sem setor dedicado.","support_channel":"Instagram (perfis dedicados por marca — Rei do Pano unificado nas 3 lojas + Rainha Modas com voz própria de moda) e Google Meu Negócio das unidades, para sustentar a prova social já existente (4,6/5,0, 327+ avaliações) e a busca local.","avoid_channels":[{"channel":"Marketplaces nacionais (Mercado Livre, Shopee) como canal principal","reason":"Citado como 'fase 2' na Pesquisa de Mercado — competir ali hoje dilui o diferencial do crediário próprio e expõe o grupo à guerra de preço/showrooming, já mapeada como ameaça e não como oportunidade imediata."},{"channel":"Mídia paga ampla, sem segmentação geográfica de ~120 km","reason":"O diagnóstico de mídia já mapeia o raio de influência real (~180 mil habitantes); investir fora dele desperdiça verba e não sustenta o território 'regional' do posicionamento."}]},"promotion":{"tone":"Familiar, Prestativo e Sólido (Manual de Copy) — autoridade de quem tem mais de 30 anos de portas abertas, mas com o carinho de quem atende pelo nome; evita comunicação puramente promocional/preço, música dessincronizada do público e posts sem legenda/contexto.","top_funnel_message":"A maior variedade em tecidos e artigos para o lar da região do Cone Sul.","bottom_funnel_message":"Renove sua casa ou monte o enxoval completo em até 6x sem juros no nosso crediário próprio — sem estourar o limite do cartão."}},"brand_territory":{"three_words":["Reinado","Legado","Facilidade"],"description":"Território de grupo, construído a partir de termos já validados nas fontes: 'Reinado' vem diretamente do conceito de marca aprovado em kick-off ('O Novo Reinado'); 'Legado' é o núcleo de marca já validado do Rei do Pano (Legado · Sanidade · Vigor); 'Facilidade' vem do pilar de marca nomeado 'Autonomia e Facilidade' (crediário próprio em até 6x sem juros). Na prática: o grupo comunica um reinado regional consolidado há mais de 30 anos, que facilita — não burocratiza — a conquista da casa e do guarda-roupa via crediário próprio. Importante: este território de GRUPO convive com dois núcleos de marca distintos e já aprovados individualmente no Manual de Marca — ver 'brand_dna_by_brand' abaixo para a separação completa por arquétipo, exigida por não diluir a diferenciação entre Rei do Pano e Rainha Modas.","competitor_territories":[{"competitor":"Havan","territory":"Escala nacional + Loja-passeio/experiência de compra (sem crediário próprio, sem vínculo regional, mix amplo sem especialidade)"},{"competitor":"Lojas Avenida","territory":"Preço popular + Humor/proximidade de marca (Cartão Avenida como âncora de fidelização, comunicação 100% promocional, sem especialidade em tecidos)"}],"availability_justification":"Nenhum dos dois concorrentes citados pelo cliente comunica um reinado regional com crediário próprio: a Havan tem escala e mix amplo, mas zero crediário e zero vínculo com Vilhena; a Lojas Avenida tem cartão próprio, mas nenhuma especialidade em tecidos nem legado de 30+ anos na região. O território está sustentado por evidência real (crediário com inadimplência de 1,5%-2,5%, nota 4,6/5,0 no Google com 327+ avaliações, 0 concorrentes disputando os termos de busca de categoria pesquisados) — não é aspiracional no diferencial em si, mas a execução digital que comunica esse território (Manual de Marca, Landing Page) ainda é recente e não plenamente distribuída, dado que a maturidade digital do grupo está em V0 (Estruturação).","brand_dna_by_brand":{"rei_do_pano":{"nucleo_3_palavras":["Legado","Sanidade","Vigor"],"anel_externo_atributos":["Aconchegante","Familiar","Prestativa","Robusta","Confiável","Justa","Humana","Completa","Consultiva","História"],"arquetipo":"Governante + Companheiro","arquetipo_descricao":"O Governante: autoridade e liderança de quem domina o segmento há décadas, evocando poder, estabilidade e soberania de mercado para ser a referência absoluta na mente do consumidor regional. O Companheiro: remove a frieza corporativa e traz calor humano — trata cada cliente pelo nome, oferece crediário sem juros baseado em confiança, garante acolhimento familiar de quase 40 anos. Na prática: tom de voz imponente e seguro, mas familiar e prestativo, nunca puramente transacional; a marca não vende 'tecidos por metro', vende a estabilidade de uma história construída com a comunidade."},"rainha_modas":{"nucleo_3_palavras":["Elegante","Antenada","Acolhedora"],"anel_externo_atributos":["Desejada","Moderna","Confiável","Acessível","Familiar","Consultiva","Completa","Expressiva","Humana","Autêntica"],"arquetipo":"Amante + Governante","arquetipo_descricao":"O Amante: desperta autoestima, desejo e celebração da identidade feminina, criando uma atmosfera de atração e sofisticação onde cada peça é um convite para a cliente se sentir única. O Governante: o peso da tradição do grupo aplicado à moda — curadoria impecável, qualidade garantida e autoridade de quem dita tendências na região, vestindo a família do infantil ao adulto. Na prática: tom envolvente, sofisticado e inspirador; a marca não vende roupas, vende transformação visual e o poder de comandar o próprio estilo com a facilidade do crediário da casa."},"nota":"unavailable_reason: não há, nos materiais-fonte, uma versão customizada e revisada dos 'Pilares e Valores' específicos da Rainha Modas — o slide correspondente no Manual de Marca reaproveita o texto literal do Rei do Pano (incluindo '40 anos', '3.000 m²' e termos de tecidos/casa). Núcleo e arquétipo da Rainha Modas acima são válidos e distintos, mas os 'Pilares e Valores' específicos de moda dessa marca seguem pendentes de confirmação com o cliente/fornecedor."}},"taglines":[{"tagline":"Construindo um Novo Reinado","tone":"aspiracional/institucional","justification":"Já é a headline oficial da Landing Page publicada (https://rei-do-pano.vercel.app/), derivada diretamente do conceito de marca aprovado em kick-off — não é uma tagline nova proposta por este canvas, é a formalização da que já está em uso real.","best_use":"Hero do site, assinatura institucional, materiais de apresentação do grupo"},{"tagline":"Dois tronos, um só compromisso.","tone":"narrativo/emocional","justification":"Sintetiza literalmente a lógica dos 'tronos digitais separados' descrita no Manifesto e no storytelling 'O Novo Reinado' do Manual de Marca, reforçando a unidade de grupo por trás das duas marcas com identidades próprias.","best_use":"Bio do Instagram de ambas as marcas, campanhas de lançamento/apresentação dos perfis separados"},{"tagline":"Reforme a casa, vista a família, em até 6x sem juros.","tone":"funcional/direto","justification":"Reaproveita a linguagem literal do Manifesto ('reformar a casa ou vestir a família... facilitado pelo nosso crediário próprio') e do Manual de Copy, atacando diretamente a dor de orçamento do ICP com prova concreta (crediário sem juros).","best_use":"Anúncios de fundo de funil (Meta Ads e Google Ads), assinatura de mensagens no WhatsApp"}],"recommended_tagline":"Construindo um Novo Reinado","operator_direction":{"strongest_differential":"Crediário próprio sem juros em até 6x — o único diferencial competitivo que nenhum concorrente mapeado (Havan, Lojas Avenida) replica digitalmente; inadimplência de apenas 1,5%-2,5% comprova a solidez da relação de confiança com a base. Fonte: handoff-account-manager.md §11 ('Diferenciais') e Pesquisa de Mercado — não coletado em sessão ao vivo com o operador nesta formalização, e sim já documentado como diferencial validado nos materiais originais do projeto.","desired_position":"Referência absoluta (Top of Mind) no Cone Sul de Rondônia em tecidos e artigos para o lar, unindo crediário facilitado e presença digital humanizada — meta declarada de aumentar as vendas do grupo em 30% nos próximos 12 meses (fonte: Pesquisa de Mercado, Sumário Executivo).","positioning_restrictions":["Não competir por preço baixo puro nem tentar imitar o modelo de 'loja-passeio' da Havan — o antídoto estratégico documentado é o crediário e o atendimento, não o desconto.","Evitar tom corporativo frio/transacional — o Manifesto declara explicitamente que a marca não quer que o cliente se sinta 'apenas mais um número'."],"desired_tone":"Familiar, Prestativo e Sólido (Manual de Copy), coerente com o voice_tone 'descontraído' declarado no briefing — autoridade de tradição regional sem soar distante."},"key_insight":{"headline":"O território 'Reinado regional com crediário próprio' está vago — 0 concorrentes disputam os termos de busca de categoria em Vilhena, mas a janela fecha à medida que a Havan avança digitalmente e o grupo segue em maturidade digital V0.","context":"Nenhum dos dois concorrentes citados pelo próprio cliente (Havan, Lojas Avenida) combina tradição regional, especialidade e crediário próprio sem juros. O grupo já vive esse território na prática há mais de 30 anos e já aprovou a narrativa 'O Novo Reinado' em kick-off — mas ainda trata o digital como 'panfleto de preço' (maturidade V0: sem Pixel, GTM, GA4 ou campanhas pagas em nenhuma marca), enquanto a Havan já opera com rastreamento e volume de mídia paga muito superiores.","numbered_reasons":["(1) Evidência de que está vago: 0 concorrentes anunciando nos termos de busca de categoria pesquisados (~410 buscas/mês combinadas, 100% intenção de compra, Google Keyword Planner) e nenhum concorrente mapeado comunica crediário próprio sem juros.","(2) O que fecha a janela: a Havan já opera com Pixel Meta, GTM e GA4 ativos, +1.100 anúncios Meta e ~4.000 Google Ads, além do avanço estrutural do e-commerce nacional via showrooming — quanto mais tempo o grupo ficar apenas com 'Instagram como panfleto de preço', mais esses concorrentes capturam a atenção do ICP, que já está no nível 3 de consciência (Consciente da Solução, pronto para decidir onde comprar).","(3) O que o cliente ganha ao ocupar primeiro: tornar-se a resposta digital óbvia para o ICP regional já 'consciente da solução', consolidando 'O Novo Reinado' antes que a Havan feche sua lacuna de vínculo regional ou que outro concorrente comece a comunicar crediário próprio."],"discussion_anchor":"O grupo já tem 40 colaboradores atendendo fisicamente, nota 4,6/5,0 no Google e um Manual de Marca de 31 páginas pronto — mas ainda não rodou uma campanha paga sequer em nenhuma das duas marcas. Cada mês sem comunicar digitalmente o crediário e a especialidade em tecidos é um mês a mais em que o cliente da região decide 'onde comprar' com base em quem aparece primeiro no feed, não em quem de fato é a melhor opção.","feasibility":"Alta — o conceito já está aprovado pelo cliente e materializado (Manual de Marca e Landing Page publicados); o que falta não é decisão estratégica, e sim consistência de execução digital (orgânico e mídia paga) nas duas marcas."},"honesty_alert":"Três pontos não devem ser tratados como 100% fechados: (1) a separação dos perfis de Instagram (Rei do Pano unificado nas 3 lojas + Rainha Modas com perfil próprio) foi debatida sem conclusão na Análise de Social Media e só depois passou a ser tratada como decidida no Manual de Marca e no plano de tráfego pago — é a informação mais recente disponível, mas nunca foi formalmente confirmada em reunião com o cliente; (2) o slide 'Pilares e Valores' da Rainha Modas no Manual de Marca reaproveita, aparentemente por erro de produção do fornecedor, o texto literal do Rei do Pano (incluindo '40 anos', '3.000 m²' e conceitos de tecidos/casa) — não deve ser usado em comunicação da Rainha Modas sem confirmar com o cliente/fornecedor se existe versão customizada; (3) o próprio tempo de mercado do grupo diverge entre fontes ('mais de 30 anos' em peças factuais/comerciais vs. 'quatro décadas'/quase 40 anos' no Manifesto e em Pilares e Valores) — recomenda-se validar a data de fundação exata antes de cravar um número específico em peças de comunicação formal.","completed_at":"2026-09-13T00:00:00Z"},"ee-s3-copy-anuncios":{"client_name":"Rei do Pano & Rainha Modas","summary":"Formalização do material já existente para Rei do Pano & Rainha Modas: Google Ads está 100% completo e pronto pra subir (2 RSAs — 10 títulos + 3 descrições + 4 sitelinks por marca, 26 elementos textuais no total), mas a copy de Meta Ads está integralmente ausente porque a seção 08 do documento-fonte ('Copy para Meta Ads') chegou truncada — só o cabeçalho sobreviveu. Este output é EXTRAÇÃO do que já foi produzido, não geração nova.","summary_headline":"Google Ads completo e pronto pra subir para as 2 marcas (2 RSAs, 26 elementos); Meta Ads 100% ausente — seção truncada na fonte original","summary_highlights":[{"category":"maturidade","label":"Cobertura por plataforma","value":"Google Ads 100% · Meta Ads 0%","subtext":"Google Ads foi extraído integralmente da seção 07 do documento-fonte; Meta Ads (seção 08) chegou truncada — só o título da seção sobreviveu","tone":"yellow"},{"category":"oportunidade","label":"RSAs prontos pra subir","value":"2 (Rei do Pano + Rainha Modas)","subtext":"10 títulos + 3 descrições + 4 sitelinks por marca, todos com contagem de caracteres validada dentro dos limites do Google Ads","tone":"green"},{"category":"janela","label":"Concorrência nos termos de busca","value":"0 concorrentes ativos","subtext":"~410 buscas/mês combinadas em Vilhena sem nenhum concorrente disputando lance (ver base-de-conhecimento/05-diagnostico-midia-trafego-pago.md, seção 5)","tone":"green"},{"category":"risco","label":"Copy de Meta Ads ausente","value":"0 variações — seção truncada na fonte","subtext":"Confirmado em duas fontes independentes: 05-diagnostico-midia-trafego-pago.md (seção 6) e handoff-account-manager.md (seção 14)","tone":"red"},{"category":"risco","label":"Funil BOFU (Lead via WhatsApp) sem copy Meta","value":"Campanha prioritária sem texto pronto","subtext":"A campanha 'Lead via WhatsApp' é a primeira a subir no Meta (ativa desde o dia 1, menor fricção) mas não tem nenhuma variação de copy disponível na fonte","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O Google Ads das duas marcas está completo e consistente: ambos os RSAs abrem com o nome da marca + Vilhena (blindagem), incluem o crediário próprio sem juros em pelo menos 3 dos 10 títulos, e fecham com CTA de menor fricção (WhatsApp) tanto em título quanto em sitelink — coerente com a estratégia de campanhas 'Blindagem de Marca' e 'Core — Intenção de Compra' descrita na fonte."},{"category":"contexto","text":"A ausência de copy de Meta Ads não é uma lacuna de execução da V4 — é uma limitação física do arquivo-fonte. O PDF 'Estruturação Estratégica de Tráfego Pago' lista a seção '08 COPY' na navegação, mas o export termina logo após o cabeçalho 'Copy para Meta Ads', sem nenhum texto de anúncio visível. Isso é confirmado de forma independente no handoff de account management (seção 14: 'Copy de Meta Ads ausente — a seção correspondente do documento-fonte está truncada')."},{"category":"ameaca","text":"Sem copy de Meta Ads, a campanha 'Lead via WhatsApp' — que o próprio plano de mídia trata como a primeira a subir, por não depender de pixel/LP maduros — fica sem nenhum texto pronto. Isso pode atrasar a ativação real do piloto de R$2.000/mês (80% Meta / 20% Google) descrito em ee-s3-forecast-midia caso o gestor de tráfego não produza copy nova antes de subir a conta."},{"category":"acao","text":"Recomenda-se reexecutar esta skill (ee-s3-copy-anuncios) assim que houver: (a) acesso ao PDF original completo e não-truncado, ou (b) autorização do operador par nsistência visual entre as duas marcas do grupo quando a arte for de fato produzida.","midjourney_prompt":"unavailable_reason: direção de arte ainda não foi definida para este conceito — gerar um prompt aqui exigiria inventar composição/estilo visual não briefado nem aprovado pelo fornecedor de design (Kuri & Co.).","ideogram_prompt":"unavailable_reason: mesmo motivo — sem direção de arte definida para esta peça.","canva_guide":"unavailable_reason: não há arte produzida para montar; um guia de montagem só pode ser escrito depois que a direção visual for definida com o fornecedor de design."}],"rainha_modas_conceito_nao_estruturado":{"headline":"Vestido com renda","subheadline":"10% de desconto no crediário da loja","button_cta":"unavailable_reason: Briefing Mestre não informa CTA para este conceito (célula vazia na tabela original, seção 05).","fonte":"base-de-conhecimento/06-landing-page-copy-criativos.md, seção 5, tabela 'Criativos Rainha Modas (briefing original)'","motivo_fora_de_variations":"Ver campo 'schema_reconciliation_note' — o schema desta skill limita 'variations' a exatamente 5 itens; este é o 6º conceito real de origem (redundante em estrutura com os outros 2 da Rainha Modas: mesma lógica de desconto no crediário) e também está sem arte finalizada."},"ab_test_guide":{"combinations":["Rodar os 3 criativos já finalizados do Rei do Pano (oferta-âncora/aquisição, institucional/crediário e reengajamento/base inativa) simultaneamente assim que Pixel Meta e WhatsApp Business estiverem configurados (pré-requisito ainda pendente, ver handoff seção 27) — comparar qual objetivo de funil gera mais clique no público frio de Vilhena.","Rainha Modas não entra neste teste nesta rodada: nenhum dos 3 conceitos ('O melhor da moda', 'As melhores marcas', 'Vestido com renda') tem arte finalizada para subir como anúncio."],"success_metrics":{"ctr_min":"1,54% (CTR blended Meta projetado para o Mês 1 em ee-s3-forecast-midia.json — não há CTR histórico real da conta, que está em maturidade digital V0 sem campanhas pagas anteriores em nenhuma das duas marcas)","cpc_max":"R$1,48 (CPC blended Meta projetado para o Mês 1, mesma fonte)"},"test_duration":"7 dias (mínimo recomendado pela metodologia desta skill — não há histórico próprio da conta para calibrar um prazo diferente)","cut_criteria":"Pausar a variação cujo CPL supere R$18,02 (CPL blended projetado do Mês 1 em ee-s3-forecast-midia.json) após volume mínimo de teste, ou cujo CTR fique abaixo de 1,54% após 1.000 impressões — critério baseado em projeção, não em benchmark histórico próprio, por a conta estar em maturidade V0."},"total_pieces":15,"total_pieces_note":"15 = 5 variações estruturadas neste output × 3 formatos de exportação (1080×1080, 1080×1350, 1080×1920), conforme metodologia padrão da skill. Isso é o escopo pleno do pacote, não o que já foi de fato produzido: hoje existem apenas 3 peças reais e finalizadas (as do Rei do Pano, todas em 1080×1080/feed_square) — nenhuma foi ainda exportada em 1080×1350 ou 1080×1920, e a Rainha Modas não tem nenhuma peça produzida (0/3)."},"ee-s3-forecast-midia":{"client_name":"Rei do Pano","summary":"Forecast de mídia para o Rei do Pano com verba fixa de R$2.000/mês, restrita a Vilhena (exclui Colorado do Oeste e Cerejeiras), split 80% Meta Ads / 20% Google Ads. Em 6 meses projeta ~1.011 leads via WhatsApp/busca (CPL blended caindo de R$18,02 para R$9,66) e ~262 clientes efetivamente atendidos na loja (CAC de mídia caindo de R$90,90 para R$32,30). Como o budget não cresce ao longo do período, a evolução é só de eficiência — não há fase de escala de verba. Ticket médio e conversão loja não constam no client.json, então este forecast é operacional (funil de mídia), não financeiro — não projeta ROAS/faturamento.","summary_headline":"R$2.000/mês em Vilhena: ~1.011 leads e ~262 clientes atendidos em 6 meses, CPL blended de R$18,02 a R$9,66","horizon":"6 meses a partir do mês de lançamento das campanhas (não há data de início confirmada em client.json)","currency":"BRL","scenario_stance":"Conservador — maturidade digital V0 (sem Pixel/GTM/GA4, sem histórico próprio de campanhas em nenhuma das duas marcas), budget abaixo de R$2.000/mês (regra de benchmark: CPL 30-50% acima no aprendizado), e ticket médio/conversão-loja ausentes no briefing. Todas as métricas de funil (CPL, CAC de mídia) são estimadas [E] sem dado histórico do cliente.","channel_split":{"total_monthly_budget":2000,"rationale":"Vilhena isolada tem baixíssimo volume de busca mensurável para o Rei do Pano (~200 buscas/mês: 110 'rei do pano vilhena' + 90 'aviamentos vilhena', 0 concorrentes disputando lance) — Google consegue capturar quase 100% dessa intenção com apenas R$400/mês (CPC mínimo por ausência de concorrência). O restante (R$1.600/mês) rende mais em Meta, criando demanda nova numa base ainda não digitalizada (maturidade V0) via WhatsApp — canal de menor fricção, sem depender de pixel/LP maduros.","channels":[{"channel":"Meta Ads","percentage":80,"monthly_value":1600,"primary_intent":"Geração de lead via WhatsApp (meio/fundo de funil) + engajamento de conteúdo orgânico (topo leve, aquece audiência para remarketing futuro)"},{"channel":"Google Ads (Search)","percentage":20,"monthly_value":400,"primary_intent":"Captura da intenção de compra já existente em Vilhena — blindagem de marca + termos de categoria (aviamentos, tecidos, cortinas sob medida)"}]},"campaigns":{"concentration_note":"Budget concentrado em só 2 plataformas (regra: budget <R$3k/mês = 1-2 plataformas, nunca pulverizar) e, dentro delas, só 2 campanhas em Meta e 3 em Google — conta nova sem histórico não deve dividir aprendizado do algoritmo entre muitas campanhas simultâneas.","meta_ads":{"monthly_budget":1600,"campaigns":[{"name":"Lead via WhatsApp — Público Frio Vilhena","objective":"Mensagens (Click-to-WhatsApp)","monthly_budget":1300,"funnel_stage":"Meio/Fundo","tecr":{"topico":"Geração de lead qualificado direto no WhatsApp da loja, sem depender de LP ou pixel maduro — caminho de menor fricção, funciona desde a primeira semana.","estrategia":"Anúncio de Mensagens com público frio geo-segmentado em raio de 15-20km de Vilhena (Av. Major Amarante) — mais estreito que o raio de 120km do plano regional original, pois esta verba é só para Vilhena.","conjunto":"Mulheres 30-60 anos, classes B/C, interesses costura/decoração/moda/artesanato; 2-3 criativos testados em paralelo (produto + crediário como gancho principal); copies testando 'renovar o enxoval' vs 'tecido pra costurar' vs 'crediário sem juros'.","resultado_esperado":"CPL projetado de R$22,50 (Mês 1) caindo a R$14,50 (Mês 6); ~71 a 110 leads/mês."}},{"name":"Engajamento de Publicação — Amplificação Orgânica","objective":"Engajamento","monthly_budget":300,"funnel_stage":"Topo","tecr":{"topico":"Amplificar o post orgânico de melhor desempenho da semana no Instagram do Rei do Pano.","estrategia":"Campanha de Engajamento de baixo custo e contínua, sem criativo novo — usa o post já validado organicamente, rotação semanal.","conjunto":"Público quente + interesses adjacentes (mesma base de interesses da campanha de Lead).","resultado_esperado":"Não gera lead direto — acumula o volume de engajamento/pixel necessário pra ativar remarketing (condição documentada: ≥1.000 pessoas engajadas OU ≥500 visitantes únicos no pixel)."}}]},"google_ads":{"monthly_budget":400,"campaigns":[{"name":"Blindagem de Marca","monthly_budget":80,"funnel_stage":"Fundo","tecr":{"topico":"Proteger o nome do Rei do Pano nos resultados de busca.","estrategia":"Correspondência exata/frase nos termos de marca.","conjunto":"rei do pano vilhena, rei do pano rondônia, rei do pano.","resultado_esperado":"CPC mínimo (concorrência baixa/nula nesses termos), praticamente 100% dos cliques convertem em lead — termo já indica quem está procurando a loja."}},{"name":"Core — Intenção de Compra (Vilhena)","monthly_budget":260,"funnel_stage":"Fundo","tecr":{"topico":"Capturar buscas de categoria com intenção de compra direta.","estrategia":"Correspondência frase/ampla controlada nos termos de maior potencial.","conjunto":"aviamentos vilhena (+57% YoY), tecidos vilhena, loja de tecidos vilhena, cortinas sob medida vilhena, materiais para costura vilhena. Negativas: grátis, tutorial, curso de costura, online, atacado, fábrica de tecidos.","resultado_esperado":"Principal fonte de leads Google — maior parte do orçamento e do volume dessa plataforma."}},{"name":"Conquista — Termos de Concorrentes","monthly_budget":60,"funnel_stage":"Fundo","tecr":{"topico":"Aparecer quando alguém busca diretamente pelos concorrentes regionais.","estrategia":"Ativada desde o Mês 1 (diferente do plano regional original, que recomendava só após a campanha Core estabilizada) — necessário para consumir o budget de R$400/mês, já que o volume nativo de busca em Vilhena é pequeno demais para gastar tudo só em Blindagem+Core.","conjunto":"lojas avenida vilhena, havan vilhena, lojas avenida tecidos, havan tecidos.","resultado_esperado":"Volume menor, mas intenção de compra comprovada — capturar com oferta de crediário próprio e variedade de tecidos que a Havan não tem."}}]}},"tracking_metrics":{"description":"Sem CRM/pixel maduro ainda (maturidade V0) — tracking inicial é manual até volume justificar automação (API de Conversões, integração Linx).","metrics":[{"id":"leads_whatsapp","metric":"Leads WhatsApp","definition":"Conversas iniciadas via clique no anúncio (Meta ou Google) que chegam no WhatsApp Business do Rei do Pano","source":"WhatsApp Business + evento Contact do Pixel Meta (após instalação via GTM)","frequency":"diária"},{"id":"cpl_blended","metric":"CPL Blended (Custo por Lead)","definition":"Budget total gasto (Meta + Google) ÷ total de leads gerados no mês","source":"Gerenciador de Anúncios Meta + Google Ads (consolidado manualmente até dashboard existir)","frequency":"semanal"},{"id":"mql_rate","metric":"Taxa de MQL (lead qualificado)","definition":"% de leads WhatsApp que são pessoa real com intenção de compra (não curioso/spam/engano)","source":"Triagem manual da equipe de atendimento no WhatsApp","frequency":"semanal"},{"id":"conversao_loja","metric":"Taxa de conversão MQL → cliente atendido","definition":"% de leads qualificados que efetivamente compram (na loja física ou fecham pelo próprio WhatsApp com o crediário)","source":"Registro manual da equipe de vendas (Linx ainda não integrado ao funil de mídia)","frequency":"semanal"},{"id":"cac_media","metric":"CAC de Mídia","definition":"Budget total do mês ÷ clientes efetivamente atendidos vindos da mídia paga (não inclui custo operacional/equipe, só verba de anúncio)","source":"Cálculo manual cruzando gasto de mídia com registro de vendas","frequency":"mensal"}]},"forecast_6_months":{"description":"Modelo blended (Meta + Google combinados) para verba fixa de R$2.000/mês em Vilhena, Rei do Pano isolado. Sem dado histórico do cliente — todas as taxas partem de benchmarks de varejo físico local ajustados pelas regras: budget <R$2k/mês → CPL 30-50% acima no Mês 1; cidade pequena/baixa concorrência → CPC tende a ser menor que médias nacionais.","evolution_logic":"Mês 1 = aprendizado (CPL 25-30% acima do patamar estável, conta nova sem pixel maduro). Mês 2-3 = otimização (pixel acumulando dados, criativos testados, Quality Score subindo no Google). Mês 4-6 = patamar estabilizado — SEM crescimento de budget (premissa explícita: R$2.000/mês fixo), a melhora vem só de eficiência (CPL e CAC caindo), não de escala de verba. Se os resultados do Mês 4-6 forem bons, a recomendação natural seria aumentar a verba — fora do escopo deste forecast específico.","monthly_evolution":[{"month":1,"label":"Mês 1 — Setup/Aprendizado","phase":"aprendizado","impressions":87500,"clicks":1350,"ctr_pct":1.54,"cpc":1.48,"leads":111,"cpl":18.02,"mql_rate_pct":65,"mqls":72,"served_clients":22,"cac_media":90.9},{"month":2,"label":"Mês 2 — Otimização inicial","phase":"otimizacao","impressions":96600,"clicks":1535,"ctr_pct":1.59,"cpc":1.3,"leads":14 ado","subheadline":"Renove a sua casa com a maior variedade regional.","body":"Fale agora mesmo com as nossas vendedoras via WhatsApp comercial e faça as suas compras de tecidos e utilidades no crediário facilitado.","cta_primary":"Falar no WhatsApp Comercial ↗"}],"faq":[{"question":"Como funciona o crediário próprio do Rei do Pano?","answer":"O crediário é facilitado e sem burocracia, feito diretamente em uma de nossas lojas físicas em Vilhena, Colorado do Oeste ou Cerejeiras. Você pode parcelar suas compras em até 6x sem juros, permitindo renovar sua casa sem estourar o limite do seu cartão de crédito."},{"question":"Posso comprar tecidos por metro pelo WhatsApp?","answer":"Com certeza! Pelo nosso atendimento de WhatsApp comercial, você pode solicitar fotos e vídeos dos tecidos disponíveis por metro (como tricoline, linho, cetim e outros), consultar estampas e fechar sua compra diretamente com a nossa equipe."},{"question":"Vocês fazem cortinas sob medida?","answer":"Sim, fazemos! Você pode passar as dimensões aproximadas da sua janela no WhatsApp, escolher o tecido e nós fazemos a confecção completa e personalizada da cortina perfeita para o seu ambiente."},{"question":"Quais são os canais de atendimento e lojas físicas?","answer":"Possuímos nossa loja física principal (sede) com 3.000m² em Vilhena - RO, e duas filiais ativas em Colorado do Oeste - RO e Cerejeiras - RO. Você pode entrar em contato com a loja mais próxima usando os botões da nossa seção geográfica acima."},{"question":"Costureiras e tapeceiros têm condições especiais?","answer":"Sim! Oferecemos preços especiais no atacado e prazos diferenciados no crediário para profissionais locais de confecção e estofamento que adquirem tecidos e aviamentos de forma regular. Fale com um vendedor pelo formulário e peça suporte profissional."},{"question":"Quais as formas de pagamento aceitas?","answer":"Aceitamos o nosso crediário próprio facilitado, cartões de crédito e débito, PIX e pagamento em espécie diretamente no caixa de nossas unidades físicas."}],"social_proof":{"testimonials":[{"name":"Maria Eduarda S.","role":null,"text":"Adoro comprar no Rei do Pano! A loja de Vilhena é gigante, com elevador e escada, e o atendimento é impecável. Fiz todo o enxoval da minha filha no crediário próprio, sem juros. Facilitou demais a nossa vida!","source":"Landing page publicada (rei-do-pano.vercel.app)","rating":5,"neighborhood":"Vilhena / RO"},{"name":"Tereza F.","role":"Costureira profissional (B2B)","text":"Sou costureira profissional e compro tecidos por metro e aviamentos lá. A variedade é incrível, sempre tem novidades e o preço no atacado é ótimo. O atendimento no WhatsApp me poupa muito tempo.","source":"Landing page publicada (rei-do-pano.vercel.app)","rating":5,"neighborhood":"Colorado do Oeste / RO"},{"name":"Valéria M.","role":null,"text":"A melhor loja para artigos de casa no Cone Sul! Eu moro em Cerejeiras e sempre peço pelo WhatsApp. Elas mandam fotos dos lençóis e panelas, e entregam bem rápido na minha cidade.","source":"Landing page publicada (rei-do-pano.vercel.app)","rating":5,"neighborhood":"Cerejeiras / RO"}],"stats":[{"number":"4,6/5,0","label":"avaliação média no Google Meu Negócio (327 avaliações)"}]},"meta":{"title":"Rei do Pano | Tecidos, Decoração e Crediário Próprio","title_live_full":"Rei do Pano | Tecidos, Decoração e Crediário Próprio em Vilhena - RO","title_length_note":"O title tag real em produção tem 68 caracteres (acima do limite de 60 do padrão desta skill). O campo 'title' acima foi truncado de forma fiel ao texto real (sem inventar palavras) para respeitar o limite do schema; 'title_live_full' guarda o texto exato como está publicado.","description":"unavailable_reason: meta description não exposta pela extração (converte para markdown, não expõe <head>); confirmar no código-fonte publicado.","og_title":"unavailable_reason: tag og:title não inspecionada (WebFetch não expõe meta tags do <head>); não confirmado se existe ou se replica o title
