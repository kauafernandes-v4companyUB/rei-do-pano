    <script>
      (function () {
        var box = document.getElementById('rdp-cookies');
        function mostrar() { box.hidden = false; document.documentElement.classList.add('rdp-cookies-aberto'); }
        function esconder() { box.hidden = true; document.documentElement.classList.remove('rdp-cookies-aberto'); }
        function aplicar(aceito) {
          var v = aceito ? 'granted' : 'denied';
          gtag('consent', 'update', { ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v });

          dataLayer.push({ event: 'cookie_consent_update', cookie_consent: aceito ? 'aceito' : 'recusado' });
        }
        box.addEventListener('click', function (e) {
          var b = e.target.closest('[data-cookies]');
          if (!b) return;
          var aceito = b.getAttribute('data-cookies') === 'aceitar';
          try { localStorage.setItem('rdp_cookies', aceito ? 'aceito' : 'recusado'); } catch (err) {}
          aplicar(aceito);
          esconder();
        });
        document.addEventListener('click', function (e) {
          if (e.target.closest('[data-abrir-cookies]')) { e.preventDefault(); mostrar(); }
        });
        if (window.__rdpCookies !== 'aceito' && window.__rdpCookies !== 'recusado') mostrar();
      })();
